name: Manual real-browser validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    # Avoid duplicate expensive Chromium runs for the identical source revision.
    concurrency:
      group: obfs-browser-${{ github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check available Chromium installation
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Compare asynchronous cross-file shared-reference graphs under Chromium CSP
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/interfile-async-browser.js
      - name: Verify native COO and SCO V8 failed-operand text under Chromium CSP
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/string-failed-operand-browser.js
      - name: Reject HTML subresource integrity script source mutation
        run: node --test test/html-asset-disclosure.test.js
      - name: Compare native and emitted SRI-pinned scripts in real Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/html-sri-browser.js
      - name: Verify byte-identical SRI under unknown public URL mounts in Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sri-content-digest-alias-browser.js
      - name: Verify SRI uppercase hash labels and document-base URL alias behavior
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sri-metadata-base-alias-browser.js
      - name: Verify inert foreign SVG base cannot mask the active HTML SRI base
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/html-sri-foreign-base-browser.js
      - name: Verify source bytes pinned by dynamically injected HTMLScriptElement
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/dynamic-script-sri-browser.js
      - name: Verify document.write parser-inserted script SRI in Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/document-write-sri-browser.js
      - name: Verify imported DOM factory cross-file dynamic SRI in Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/dynamic-interfile-sri-browser.js
      - name: Compare native and SCO SRI at percent-encoded HTTP route mounts
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-sri-encoded-route-browser.js
      - name: Verify SRI with URL-encoded document filename segments
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/html-sri-filename-browser.js
      - name: Verify portable URL SRI aliases retain exact script bytes
        run: node --test test/sri-portable-url-alias.test.js
      - name: Verify SRI under real Chromium with case- and NFC-normalizing HTTP paths
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sri-portable-url-alias-browser.js
      - name: Reject executable sources in generic XML assets and preserve SRI
        run: node --test test/xml-executable-asset.test.js
      - name: Compare generic XML MIME native SRI and inline script execution in Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/xml-sri-browser.js
      - name: Reject XHTML XML-namespace inline JavaScript and preserve SRI
        run: node --test test/xhtml-executable-asset.test.js
      - name: Check executable XHTML and SRI-pinned scripts in real Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/xhtml-sri-browser.js
      - name: Run live browser integration suite
        env:
          CHROMIUM_BIN: google-chrome
        run: npm run test:browser
      - name: Compare private factory imported-destructuring graph in real Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/factory-destructuring-browser.js
      - name: Check source-byte observer negative and performance.now positive
        run: node --test test/cross-file-source-byte-reader.test.js
      - name: Compare native and emitted ESM ResourceTiming decoded byte sizes
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/resource-timing-observer-browser.js
      - name: Native-versus-COO function-source clone errors in Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/clone-source-browser.js
      - name: Demonstrate hostile browser interception of a bound private function target
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/bound-runtime-interception-browser.js
      - name: Verify executable XML document URL behavior in Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/xml-data-url-browser.js
      - name: Observe executable XML MIME under unrecognized asset extension
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/undeclared-xml-mime-source-witness.js
      - name: Verify public-only XOR string decoding under real Chromium CSP
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/jsdeobsbench-public-browser.js
      - name: Strict-check external benchmark and browser harness JSDoc
        run: npm run typecheck:external
      - name: Compare held-out multi-file property graphs in Chrome
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/heldout-browser-integration.js
      - name: Compare imported constant-key ownership under real browser CSP
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/imported-constant-key-browser.js
      - name: Execute real server-private SCO before-and-after example in Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-real-browser.js
      - name: Compare native and SCO varied mixed UTF-16 literals in real Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-spelling-mask-browser.js
      - name: Verify external dynamic ESM intrinsic mutation and known-graph positive decoding
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/decoder-dynamic-data-esm-browser.js
      - name: Compare native and guarded large ESM strings after prototype index mutation in Chrome
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/decoder-array-prototype-browser.js
      - name: Strict-check pinned TLS Chromium SCO challenge JSDoc
        run: npx tsc -p jsconfig.sco-tls-browser.json
      - name: Execute real SCO client over test-pinned HTTPS in Chromium
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-real-tls-browser.js
      - name: Test experimental COO piggyback sharding in real Chrome
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/coo-piggyback-browser.js
      - name: Check experimental COO piggyback JSDoc types
        run: node_modules/.bin/tsc -p jsconfig.piggyback.json
      - name: Check JSDoc types
        run: npm run typecheck

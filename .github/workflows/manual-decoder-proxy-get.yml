name: Manual decoder Proxy get provenance parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decoder-proxy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Proxy getter native and emitted parity plus yield
        run: node --test test/decoder-proxy-get.test.js
      - name: JSDoc checker
        run: npm run typecheck

name: Manual private Symbol-key backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbol-keys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Proven own-key membership differential across COO SNO and ESM
        run: node --test test/property-in-operator.test.js test/property-in-adversarial.test.js
      - name: Native and attacker differential tests
        run: node --test test/symbol-keys.test.js test/symbol-key-static-recovery.test.js
      - name: Native versus rewritten own-key membership hot-loop cost
        run: node sims/property-in-operator-profile.js
      - name: Verify published-only AST reconstruction of private own-key membership
        run: node sims/property-in-operator-static-recover.js
      - name: Measure steady-state hot-key performance
        run: node sims/symbol-key-profile.js
      - name: Report multi-object cold-start cost
        run: node sims/symbol-key-cold.js
      - name: Real Chromium COO modules and external page API
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/symbol-keys-browser.js
      - name: Real Chromium own-key membership native renamed Symbol and external page API
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/property-in-browser.js
      - name: Strict external JSDoc typecheck for new membership tests
        if: ${{ always() }}
        run: npm run typecheck:external
      - name: Strict JSDoc typecheck
        if: ${{ always() }}
        run: npm run typecheck

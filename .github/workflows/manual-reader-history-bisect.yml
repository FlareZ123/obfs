name: One-shot cross-file reader historical bisect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-regression-bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Identify first property-coverage failure over a known green-to-red interval
        shell: bash
        run: |
          git bisect start f13311835ab682948ec072d57b079242c90dd887 87c8126e2185c01204c63f32f74ca69d50dae50d
          git bisect run node --test --test-name-pattern="closed-world ESM imported reader is safe across multiple consumers" test/cross-file-reader-flow.test.js
          git bisect log
          git bisect reset

name: Manual frozen application adversary challenge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Strict JSDoc for frozen SNO tooling and attack harnesses
        run: npm run typecheck:external
      - name: Diagnose private-field proof refusal and positive control
        run: node sims/application-challenge-proof-diagnosis.js
      - name: Isolate independent whole-graph source-observer vetoes
        run: node sims/application-challenge-observer-ablation.js
      - name: Build exact generated public bytes for snapshot review
        run: node examples/application-challenge/build.cjs --dump
      - name: Differential semantics and offline attacker baseline
        run: node --test test/application-challenge.test.js
      - name: Independent public-file copy attack
        run: node sims/application-challenge-offline-copy.js examples/application-challenge/after

      - name: SNO single-entry frozen application differential and owner attack
        run: node --test test/application-challenge-sno.test.js
      - name: SNO mixed ESM graph attacker and paired whole-process costs
        run: node sims/application-challenge-sno.js --profile
      - name: SNO transformed multi-module application and independent owner attack
        run: node --test test/polyvariant-app-sno.test.js
      - name: SNO transformed multi-module startup and protected-work profile
        run: node sims/polyvariant-app-sno.js --profile
      - name: Paired hot and whole-session performance with held-out attacker
        run: node sims/application-challenge-profile.js
      - name: Run browser COO app and prove original engine source is public
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/application-challenge-coo-browser.js

  legacy-node22:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.0.0'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Exercise original Node 22.0 ESM loader and frozen SNO graphs
        run: node --test test/polyvariant-app-sno.test.js test/application-challenge-sno.test.js
      - name: Strict JSDoc for frozen SNO tools
        run: npm run typecheck:external

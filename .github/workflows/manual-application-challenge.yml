name: Manual frozen application adversary challenge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce original PR15 reflected intrinsic alias suite against current main
        run: node --test test/closed-record-inherited-setter-host.test.js
      - name: Compile JSDoc source contracts
        run: npm run typecheck
      - name: Compile external test JSDoc
        run: npm run typecheck:external

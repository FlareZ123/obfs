name: Manual frozen application adversary challenge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Replay inherited Reflect setter host counterexample on historical PR15 compiler
        run: node --test test/closed-record-inherited-setter-host.test.js
      - name: Strict compiler JSDoc
        run: npm run typecheck
      - name: Strict external test JSDoc
        run: npm run typecheck:external

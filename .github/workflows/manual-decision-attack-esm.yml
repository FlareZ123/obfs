name: Manual multi-file ESM attacker comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-file:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run shared multi-file ESM workload with held-out static attacks
        run: node sims/decision-attack-grid.js
      - name: Freeze real three-arm ESM files and run matched public-only attacker
        env:
          OBFS_FROZEN_OUTPUT_DIR: frozen-polyvariant-${{ runner.os }}
        run: node --test test/frozen-polyvariant-receipt.test.js
      - name: Archive exact executed and attacked ESM bytes with machine receipt
        uses: actions/upload-artifact@v4
        with:
          name: frozen-polyvariant-${{ runner.os }}
          path: frozen-polyvariant-${{ runner.os }}/
          if-no-files-found: error
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-attack-esm-${{ matrix.os }}
          path: decision-grid-output.json
          if-no-files-found: ignore
      - name: Validate strict JSDoc
        run: npm run typecheck

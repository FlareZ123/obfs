name: Manual SCO large-domain oracle and performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Measure trusted private HMAC and authenticated oracle
        run: node sims/sco-large-domain-prf.js
      - name: Measure live third-party relay of an attacker-authorized session
        run: node sims/sco-relay-attack.js
      - name: Strict main JSDoc preflight
        run: npm run typecheck
      - name: Strict external JSDoc preflight
        run: npm run typecheck:external
      - name: SCO stateful ratchet replay and budget experiment
        run: node sims/sco-ratchet-boundary.js
      - name: SCO atomic ratchet batch 25ms RTT-surrogate and budget veto
        run: node sims/sco-ratchet-batch-candidate.js

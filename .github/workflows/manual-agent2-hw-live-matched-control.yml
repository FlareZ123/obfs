name: Manual Agent 2 hW live HTTP matched control

on:
  workflow_dispatch:
    inputs:
      fixture_family:
        description: "Target fixture family"
        required: false
        default: random
        type: choice
        options:
          - random
          - delayed-pair
      min_states:
        description: "Minimum target states (random: 2-24; delayed-pair: 3-64)"
        required: false
        default: 2
        type: number
      max_states:
        description: "Maximum target states (random: 2-24; delayed-pair: 3-64)"
        required: false
        default: 5
        type: number
      seeds:
        description: "Target samples per state count (1-20)"
        required: false
        default: 2
        type: number
      target_seed_mode:
        description: "Target seed source; random uses 64-bit OS entropy, deterministic is for replay"
        required: false
        default: random
        type: choice
        options:
          - random
          - deterministic
      timeout_seconds:
        description: "Per-arm hW learner timeout"
        required: false
        default: 120
        type: number
      random_walk_length:
        description: "RandomWphWOracle random walk length"
        required: false
        default: 30
        type: number
      origin_states:
        description: "RandomWphWOracle test origin-state count"
        required: false
        default: 20
        type: number
      learner_seed:
        description: "Independent learner RNG seed; never derived from target seed/state count"
        required: false
        default: 41342
        type: number
      version_space_max_cases:
        description: "Number of prioritized live traces for bounded version-space audit"
        required: false
        default: 4
        type: number
      version_space_timeout_ms:
        description: "Per-candidate-size Z3 timeout in milliseconds"
        required: false
        default: 10000
        type: number

permissions:
  contents: read

jobs:
  matched-control:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm ci
      - name: Install pinned hW implementation
        run: python -m pip install --disable-pip-version-check aalpy==2.0.0 numpy==2.2.6 z3-solver==5.4.1.0
      - name: Check server and harness syntax
        run: |
          node --check sims/agent2-hw-live-sco-server.js
          node --check sims/agent2-hw-live-ordinary-server.js
          python -m py_compile \
            sims/agent2-hw-live-sco-client.py \
            sims/agent2-hw-live-sco-benchmark.py \
            sims/agent2-hw-live-matched-control.py \
            sims/agent2_hw_process_isolation.py \
            sims/agent49-process-isolation-probe.py \
            sims/agent49-hw-single-arm-network-probe.py \
            sims/test_agent49-hw-single-arm-network-probe.py \
            sims/test_agent49_hw_public_module_archive.py \
            sims/agent2-hw-no-reset-benchmark.py \
            sims/agent2-hw-version-space-audit.py \
            sims/agent49-hw-version-space-small-exhaustive-crosscheck.py
      - name: Verify cross-UID process isolation
        run: python sims/agent49-process-isolation-probe.py
      - name: Test IPv4/IPv6 local TCP listener discovery
        run: python sims/test_agent49-hw-single-arm-network-probe.py
      - name: Verify sequential single-arm localhost isolation
        run: python sims/agent49-hw-cross-arm-network-probe-runner.py
      - name: Test exact evaluator semantics
        run: |
          python sims/test_agent2_hw_no_reset_evaluator.py
          python sims/test_agent49_hw_public_module_archive.py
          python sims/test_agent2_hw_version_space.py
          python sims/agent49-hw-version-space-small-exhaustive-crosscheck.py
      - name: Run paired live HTTP hW benchmark
        env:
          FIXTURE_FAMILY: ${{ inputs.fixture_family || 'random' }}
          MIN_STATES: ${{ inputs.min_states || 2 }}
          MAX_STATES: ${{ inputs.max_states || 5 }}
          SEEDS: ${{ inputs.seeds || 2 }}
          TARGET_SEED_MODE: ${{ inputs.target_seed_mode || 'random' }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || 120 }}
          RANDOM_WALK_LENGTH: ${{ inputs.random_walk_length || 30 }}
          ORIGIN_STATES: ${{ inputs.origin_states || 20 }}
          LEARNER_SEED: ${{ inputs.learner_seed }}
        run: |
          python sims/agent2-hw-live-matched-control.py \
            --fixture-family "$FIXTURE_FAMILY" \
            --min-states "$MIN_STATES" --max-states "$MAX_STATES" \
            --seeds "$SEEDS" --target-seed-mode "$TARGET_SEED_MODE" \
            --timeout-seconds "$TIMEOUT_SECONDS" \
            --random-walk-length "$RANDOM_WALK_LENGTH" \
            --origin-states "$ORIGIN_STATES" \
            --learner-seed "$LEARNER_SEED" \
            > live-hw-matched-results.json
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("live-hw-matched-results.json").read_text())
          family = os.environ["FIXTURE_FAMILY"]
          minimum = int(os.environ["MIN_STATES"])
          maximum = int(os.environ["MAX_STATES"])
          seeds = int(os.environ["SEEDS"])
          expected = (maximum - minimum + 1) * seeds
          assert result["benchmark"] == "agent2-live-http-no-reset-hW-matched-control"
          assert result["aalpy_version"] == "2.0.0"
          assert result["scope"]["fixture_family"] == family
          assert result["scope"]["state_counts"] == [minimum, maximum]
          assert result["total_runs"] == expected
          assert result["completed_runs"] + result["timeouts"] + result["errors"] == expected
          assert result["completed_runs"] > 0
          assert result["errors"] == 0, result["results"]
          assert result["matched_pairs"] == result["completed_runs"]
          assert result["total_sco_sul_steps"] == result["total_ordinary_sul_steps"]
          assert result["total_sco_http_requests"] == result["total_ordinary_http_requests"]
          for row in result["results"]:
              if row["status"] != "completed":
                  continue
              assert row["comparison"]["matched"], row
              # The artifact now contains byte-exact published SCO and ordinary
              # client modules, not just hashes. Preserve independent analyst
              # access to the actual static bytes used by this learning run.
              for arm in ("sco", "ordinary"):
                  preflight = row[arm]["preflight"]
                  encoded = preflight["public_module_base64"]
                  published = base64.b64decode(encoded, validate=True)
                  assert 0 < len(published) <= 1024 * 1024, row
                  assert len(published) == preflight["source_bytes"], row
                  assert hashlib.sha256(published).hexdigest() == preflight["source_sha256"], row
                  assert hashlib.sha256(published).hexdigest() == row[arm]["client_module_body_sha256"], row
                  assert published.decode("utf-8").encode("utf-8") == published, row
                  assert preflight["source_disclosed"] is False, row
              assert row["sco"]["preflight"]["public_module_base64"] != row["ordinary"]["preflight"]["public_module_base64"], row
              assert row["comparison"]["session_tokens_distinct"] is True, row
              assert row["server_user_isolated"] is True, row
              assert row["sco"]["server_process"]["uid"] == result["scope"]["server_uid"], row
              assert row["ordinary"]["server_process"]["uid"] == result["scope"]["server_uid"], row
              assert row["sco"]["learner_process"]["uid"] == result["scope"]["learner_uid"], row
              assert row["ordinary"]["learner_process"]["uid"] == result["scope"]["learner_uid"], row
              assert row["sco"]["learner_process"]["euid"] == result["scope"]["learner_uid"], row
              assert row["ordinary"]["learner_process"]["euid"] == result["scope"]["learner_uid"], row
              assert row["sco"]["learner_process"]["learner_seed"] == int(os.environ["LEARNER_SEED"]), row
              assert row["ordinary"]["learner_process"]["learner_seed"] == int(os.environ["LEARNER_SEED"]), row
              assert row["sco"]["server_process"]["private_root_mode"] == "700", row
              assert row["sco"]["server_process"]["private_file_mode"] == "600", row
              for process in (row["sco"]["server_process"], row["ordinary"]["server_process"]):
                  assert process["no_new_privs"] == "1", row
                  assert process["cap_eff"] == "0000000000000000", row
                  assert process["cap_bnd"] == "0000000000000000", row
              for process in (row["sco"]["learner_process"], row["ordinary"]["learner_process"]):
                  assert process["no_new_privs"] == "1", row
                  assert process["cap_eff"] == "0000000000000000", row
                  assert process["cap_bnd"] == "0000000000000000", row
                  assert process["sudo_blocked"] is True, row
              for process in (row["sco"]["learner_process"], row["ordinary"]["learner_process"]):
                  assert not any(key.startswith(("GITHUB_", "RUNNER_", "ACTIONS_", "TARGET_", "FIXTURE_", "ORACLE_")) for key in process["environment_keys"]), row
              assert row["comparison"]["learner_trace_equal"], row
              assert row["comparison"]["hypothesis_equal"], row
              assert row["comparison"]["rpc_request_response_trace_equal"], row
              assert row["comparison"]["client_module_public_metadata_equal"], row
              assert row["comparison"]["client_module_source_bodies_differ"], row
              assert row["comparison"]["authorized_invalid_argument_probe_equal"], row
              assert row["comparison"]["server_request_counts_equal"], row
              assert row["comparison"]["exact_evaluation_equal"], row
              assert row["sco"]["steps_total"] == row["ordinary"]["steps_total"], row
              assert row["sco"]["rpc_trace_sha256"] == row["ordinary"]["rpc_trace_sha256"], row
              assert row["sco"]["server_stats"] == row["ordinary"]["server_stats"], row
              assert row["sco"]["source_disclosed"] is False, row
              assert row["ordinary"]["source_disclosed"] is False, row
          summary = {
              "fixture_family": family,
              "learner_seed": result["scope"]["learner_seed"],
              "server_uid": result["scope"]["server_uid"],
              "learner_uid": result["scope"]["learner_uid"],
              "runs": result["total_runs"],
              "completed": result["completed_runs"],
              "timeouts": result["timeouts"],
              "errors": result["errors"],
              "matched_pairs": result["matched_pairs"],
              "sco_exact_initial_clones": result["sco_exact_initial_clones"],
              "sco_future_clone_successes": result["sco_future_clone_successes"],
              "ordinary_exact_initial_clones": result["ordinary_exact_initial_clones"],
              "ordinary_future_clone_successes": result["ordinary_future_clone_successes"],
              "sco_sul_steps": result["total_sco_sul_steps"],
              "ordinary_sul_steps": result["total_ordinary_sul_steps"],
              "sco_http_requests": result["total_sco_http_requests"],
              "ordinary_http_requests": result["total_ordinary_http_requests"],
              "elapsed_seconds": result["elapsed_seconds"],
              "cases": [
                  {
                      "state_count": row["state_count"],
                      "seed": row["seed"],
                      "steps": row["sco"]["steps_total"],
                      "trace_digest": row["trace_digest"],
                      "sco": {
                          key: row["sco"]["evaluation"][key]
                          for key in (
                              "candidate_count",
                              "candidate_end_equivalence_classes",
                              "exact_initial_clone_success",
                              "future_clone_success",
                              "false_initial_convergence",
                              "false_future_convergence",
                              "ambiguous_initial_behavior",
                              "ambiguous_future_behavior",
                              "candidate_results",
                          )
                      },
                      "ordinary": {
                          key: row["ordinary"]["evaluation"][key]
                          for key in (
                              "candidate_count",
                              "candidate_end_equivalence_classes",
                              "exact_initial_clone_success",
                              "future_clone_success",
                              "false_initial_convergence",
                              "false_future_convergence",
                              "ambiguous_initial_behavior",
                              "ambiguous_future_behavior",
                              "candidate_results",
                          )
                      },
                  }
                  for row in result["results"]
                  if row["status"] == "completed"
              ],
          }
          print("LIVE_HW_MATCHED_CONTROL_SUMMARY", json.dumps(summary, sort_keys=True))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary_file:
                  summary_file.write("### Live hW matched-control results\n\n")
                  summary_file.write("~~~json\n")
                  summary_file.write(json.dumps(summary, indent=2, sort_keys=True))
                  summary_file.write("\n~~~\n")
          PY
      - name: Audit bounded full Mealy version space from evaluator-only live traces
        run: |
          python sims/agent2-hw-version-space-audit.py \
            --input live-hw-matched-results.json \
            --output hw-version-space-audit.json \
            --max-cases "${{ inputs.version_space_max_cases || 4 }}" \
            --timeout-ms "${{ inputs.version_space_timeout_ms || 10000 }}"
      - name: Print bounded version-space uncertainty details
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("hw-version-space-audit.json").read_text())
          for case in result["cases"]:
              audit = case["audit"]
              print("VERSION_SPACE_CASE", json.dumps({
                  "state_count": case["state_count"],
                  "seed": case["seed"],
                  "status": audit["status"],
                  "elapsed_seconds": audit.get("elapsed_seconds"),
                  "candidate_size_search": audit.get("candidate_size_search"),
                  "witness": audit.get("witness"),
              }, sort_keys=True))
          PY
      - name: Preserve matched-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-live-hw-matched-control
          path: |
            live-hw-matched-results.json
            agent49-cross-arm-probe-result.json
            hw-version-space-audit.json

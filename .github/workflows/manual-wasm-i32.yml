name: Manual typed Int32 WebAssembly backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check LLVM 18 toolchain
        run: |
          command -v clang-18
          clang-18 --version
      - name: Download and verify Amice v0.1.6-beta.2 LLVM 18 plugin
        run: |
          curl -L --fail --retry 3 -o libamice.so \
            https://github.com/fuqiuluo/amice/releases/download/v0.1.6-beta.2/libamice-llvm18-linux-x86_64.so
          curl -L --fail --retry 3 -o libamice.so.sha256 \
            https://github.com/fuqiuluo/amice/releases/download/v0.1.6-beta.2/libamice-llvm18-linux-x86_64.so.sha256
          HASH="$(awk '{print $1}' libamice.so.sha256)"
          printf '%s  libamice.so\n' "$HASH" > libamice.local.sha256
          sha256sum -c libamice.local.sha256
      - name: Build baseline and VMP-protected kernel
        env:
          AMICE_PANIC_POLICY: abort
        run: |
          clang-18 -O3 -s sims/tigress-native-virtualize/kernel.c \
            sims/tigress-native-virtualize/bench.c -o baseline
          clang-18 -O3 -s -DAMICE_OBF -fpass-plugin="$GITHUB_WORKSPACE/libamice.so" \
            sims/tigress-native-virtualize/kernel.c \
            sims/tigress-native-virtualize/bench.c -o virtualized
          wc -c baseline virtualized
      - name: Measure VMP runtime admission gate
        run: |
          ./baseline | tee baseline.txt
          ./virtualized | tee virtualized.txt
          python - <<'PY'
          import re
          b=int(re.search(r'median_ns=(\d+)',open('baseline.txt').read()).group(1))
          v=int(re.search(r'median_ns=(\d+)',open('virtualized.txt').read()).group(1))
          ratio=v/b
          print(f'AMICE_VMP_RATIO baseline_ns={b} virtualized_ns={v} ratio={ratio:.6f}')
          print('AMICE_VMP_BUDGET_PASS', str(ratio <= 2.5).lower())
          PY

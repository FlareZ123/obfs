name: Manual typed Int32 WebAssembly backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-i32:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Differential, negative and public-binary extraction tests
        run: node --test test/wasm-i32.test.js test/wasm-i32-static-recovery.test.js test/wasm-i32-early-cycle.test.js test/wasm-i32-nested-fuzz.test.js test/wasm-i32-multiparam.test.js test/wasm-i32-multifile.test.js test/wasm-i32-conditional.test.js test/wasm-i32-lazy-conditional.test.js test/wasm-i32-multi-early-cycle.test.js test/wasm-i32-conditional-fuzz.test.js test/wasm-i32-negative-zero.test.js test/regexp-function-source-observer.test.js test/string-prototype-function-source-receiver.test.js test/function-source-coercion-matrix.test.js test/string-static-function-source-observer.test.js test/source-observer-counterfactual-differential.test.js
      - name: Verify pinned before/after artifact
        run: |
          node examples/wasm-i32/build.cjs
          node examples/wasm-i32-multi/build.cjs
          node examples/wasm-i32-conditional/build.cjs
          node examples/wasm-i32-lazy/build.cjs
      - name: Hostile-runtime binary extraction and function replacement
        run: node sims/wasm-i32-runtime-extraction.js
      - name: Whole-session initialization cost curve
        run: node sims/wasm-i32-cold-counterexample.js
      - name: Strict JSDoc checks
        run: npm run typecheck
      - name: Strict Wasm research and attacker JSDoc checks
        run: npx tsc -p jsconfig.wasm-i32.json
      - name: Real Chromium COO ESM host API
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/wasm-i32-browser.js
      - name: Real Chromium strict CSP denial and targeted Wasm allowance
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/wasm-i32-csp-browser.js

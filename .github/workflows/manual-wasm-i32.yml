name: Manual typed Int32 WebAssembly backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned node-gyp
        run: npm install --no-save --no-package-lock node-gyp@13.1.0
      - name: Build release Node-API addon
        run: node_modules/.bin/node-gyp rebuild --release --directory sims/sno-native-addon
      - name: Verify native behavior and warm runtime
        run: node sims/sno-native-addon/bench.js
      - name: Inspect raw artifact strings
        shell: bash
        run: |
          BIN="sims/sno-native-addon/build/Release/sno_native.node"
          echo "NATIVE_ADDON_BYTES $(wc -c < "$BIN")"
          if grep -a -F -q 'secretLedgerTransformNative' "$BIN"; then
            echo "NATIVE_ADDON_ORIGINAL_IDENTIFIER true"
          else
            echo "NATIVE_ADDON_ORIGINAL_IDENTIFIER false"
          fi

  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned node-gyp
        run: npm install --no-save --no-package-lock node-gyp@13.1.0
      - name: Build stripped release addon
        run: node_modules/.bin/node-gyp rebuild --release --directory sims/sno-native-addon
      - name: Download official Ghidra 12.2 release
        run: |
          curl -L --fail --retry 3 -o ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          unzip -q ghidra.zip
          mv ghidra_12.2_PUBLIC ghidra
      - name: Decompile every detected addon function
        run: |
          mkdir -p ghidra-project
          ghidra/support/analyzeHeadless ghidra-project native-addon \
            -import sims/sno-native-addon/build/Release/sno_native.node \
            -scriptPath sims/sno-native-addon \
            -postScript DecompileAllFunctions.java \
            -analysisTimeoutPerFile 120 \
            -deleteProject > native-decompile.txt 2>&1
          echo "NATIVE_DECOMPILE_BYTES $(wc -c < native-decompile.txt)"
          grep -n -E '1664525|1013904223|1103515245|12345|0x19660d|0x3c6ef35f|0x41c64e6d|0x3039|19660d|3c6ef35f|41c64e6d|3039' \
            native-decompile.txt | head -120 || true
          grep -n 'DECOMPILE_FUNCTION' native-decompile.txt | head -80
          tail -220 native-decompile.txt

name: Manual typed Int32 WebAssembly backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-i32:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Differential, negative and public-binary extraction tests
        run: node --test test/wasm-i32.test.js test/wasm-i32-static-recovery.test.js test/wasm-i32-early-cycle.test.js
      - name: Verify pinned before/after artifact
        run: node examples/wasm-i32/build.cjs
      - name: Whole-session initialization cost curve
        run: node sims/wasm-i32-cold-counterexample.js
      - name: Strict JSDoc checks
        run: npm run typecheck
      - name: Real Chromium COO ESM host API
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/wasm-i32-browser.js

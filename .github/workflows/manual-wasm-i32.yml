name: Manual typed Int32 WebAssembly backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned node-gyp
        run: npm install --no-save --no-package-lock node-gyp@13.1.0
      - name: Build release Node-API addon
        run: node_modules/.bin/node-gyp rebuild --release --directory sims/sno-native-addon
      - name: Verify native behavior and warm runtime
        run: node sims/sno-native-addon/bench.js
      - name: Inspect raw artifact strings
        shell: bash
        run: |
          BIN="sims/sno-native-addon/build/Release/sno_native.node"
          if [ ! -f "$BIN" ]; then
            BIN="sims/sno-native-addon/build/Release/sno_native.node"
          fi
          echo "NATIVE_ADDON_BYTES $(wc -c < "$BIN")"
          if grep -a -F -q 'secretLedgerTransformNative' "$BIN"; then
            echo "NATIVE_ADDON_ORIGINAL_IDENTIFIER true"
          else
            echo "NATIVE_ADDON_ORIGINAL_IDENTIFIER false"
          fi

  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned node-gyp
        run: npm install --no-save --no-package-lock node-gyp@13.1.0
      - name: Build stripped release addon
        run: node_modules/.bin/node-gyp rebuild --release --directory sims/sno-native-addon
      - name: Download official Cutter 2.5.0 release
        run: |
          curl -L --fail --retry 3 -o cutter.AppImage \
            https://github.com/rizinorg/cutter/releases/download/v2.5.0/Cutter-v2.5.0-Linux-x86_64.AppImage
          chmod +x cutter.AppImage
          ./cutter.AppImage --appimage-extract >/dev/null
      - name: Locate bundled Rizin and Ghidra plugin
        run: |
          find squashfs-root -type f \( -name rizin -o -name 'lib*ghidra*' -o -name '*rz-ghidra*' \) -print
          squashfs-root/usr/bin/rizin -v
      - name: Decompile all detected functions with bundled rz-ghidra
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          BIN="sims/sno-native-addon/build/Release/sno_native.node"
          RZ="squashfs-root/usr/bin/rizin"
          "$RZ" -q -N -e scr.color=false -c 'aaa; pdgo @@F' "$BIN" > native-decompile.txt
          echo "NATIVE_DECOMPILE_BYTES $(wc -c < native-decompile.txt)"
          grep -n -E '1664525|1013904223|1103515245|12345|0x19660d|0x3c6ef35f|0x41c64e6d|0x3039' \
            native-decompile.txt | head -80 || true
          head -160 native-decompile.txt

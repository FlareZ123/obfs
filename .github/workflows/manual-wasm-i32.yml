name: Manual native branchless SNO candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned node-gyp
        run: npm install --no-save --no-package-lock node-gyp@13.1.0
      - name: Build release Node-API addon
        run: node_modules/.bin/node-gyp rebuild --release --directory sims/sno-native-flat-addon
      - name: Verify behavior and warm runtime
        run: node sims/sno-native-flat-addon/bench.js
      - name: Inspect raw artifact constants
        shell: bash
        run: |
          BIN="sims/sno-native-flat-addon/build/Release/sno_native_flat.node"
          echo "NATIVE_FLAT_BYTES $(wc -c < "$BIN")"
          for HEX in 19660d 3c6ef35f 41c64e6d 3039 13579bdf 9e2e1fb4 43248f4a 90730458 94d07982 36126f4e; do
            if xxd -p "$BIN" | tr -d '\n' | grep -qi "$HEX"; then
              echo "RAW_HEX_$HEX true"
            else
              echo "RAW_HEX_$HEX false"
            fi
          done

  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned node-gyp
        run: npm install --no-save --no-package-lock node-gyp@13.1.0
      - name: Build stripped release addon
        run: node_modules/.bin/node-gyp rebuild --release --directory sims/sno-native-flat-addon
      - name: Download official Ghidra 12.2 release
        run: |
          curl -L --fail --retry 3 -o ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          unzip -q ghidra.zip
          mv ghidra_12.2_PUBLIC ghidra
      - name: Decompile and search semantic constants
        run: |
          mkdir -p ghidra-project
          ghidra/support/analyzeHeadless ghidra-project native-flat \
            -import sims/sno-native-flat-addon/build/Release/sno_native_flat.node \
            -scriptPath sims/sno-native-addon \
            -postScript DecompileAllFunctions.java \
            -analysisTimeoutPerFile 120 \
            -deleteProject > native-flat-decompile.txt 2>&1
          echo "NATIVE_FLAT_DECOMPILE_BYTES $(wc -c < native-flat-decompile.txt)"
          echo "ORIGINAL_CONSTANT_HITS"
          grep -ni -E '1664525|1013904223|1103515245|12345|0x19660d|0x3c6ef35f|0x41c64e6d|0x3039|19660d|3c6ef35f|41c64e6d|3039' native-flat-decompile.txt | head -120 || true
          echo "ENCODED_CONSTANT_HITS"
          grep -ni -E '9e2e1fb4|43248f4a|90730458|94d07982|36126f4e|9e3779b9|7f4a7c15|d1b54a35|94d049bb|2545f491' native-flat-decompile.txt | head -120 || true
          grep -n 'DECOMPILE_FUNCTION' native-flat-decompile.txt | head -80
          tail -260 native-flat-decompile.txt

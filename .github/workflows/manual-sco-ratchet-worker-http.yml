name: Manual SCO worker-thread authenticated cross-account fairness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-fairness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Check main and external strict JSDoc
        run: |
          npm run typecheck
          npm run typecheck:external
      - name: Real server-resident private worker vs main-thread SCO A/B challenge
        run: node sims/sco-ratchet-worker-http-contention.js

name: Manual source island indirect-loader regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent5-red-setters:
    strategy:
      fail-fast: false
      matrix:
        scenario: [reflect-set, object-assign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Red-first Chromium host-supplied SRI for pre-guard Reflect/Object setter
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node sims/agent5-source-island-windowproxy-sri-browser.js --${{ matrix.scenario }}

name: Source island indirect loader adversary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  island-escape:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lock modification
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify source-island native/generated regression and positive control
        run: node --test test/source-observer-islands.test.js test/source-observer-islands-reflection-gate.test.js
      - name: Execute exact native/generated source-read differential
        run: node sims/source-island-indirect-loader-attack.js
      - name: Attempt constructor escape via native object destructuring
        run: node sims/source-island-indirect-loader-attack.js --destructure
      - name: Validate repository JSDoc types
        run: npm run typecheck
      - name: Validate external corpus JSDoc types
        run: npm run typecheck:external

name: Manual held-out ESM property-flow attack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mba-int32:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify held-out Int32 inverse regression
        run: node --test test/mba-author-int32-heldout.test.js
      - name: Profile held-out Int32 runtime frontier
        run: node sims/mba-author-int32-heldout.js
      - name: Typecheck MBA Int32 research lane
        run: npx tsc --allowJs --checkJs --noEmit --strict --target ES2022 --module commonjs --moduleResolution node --types node --skipLibCheck sims/mba-author-int32-component-inverse.js sims/mba-author-int32-heldout.js test/mba-author-int32-heldout.test.js

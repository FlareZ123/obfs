name: Manual held-out ESM property-flow attack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mba-int32-heldout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify frozen attacker and post-freeze held-out corpus
        run: node --test test/mba-author-int32-minified-recover.test.js test/mba-author-int32-minified-heldout.test.js test/mba-author-int32-heldout.test.js
      - name: Emit post-freeze recovery records
        run: node sims/mba-author-int32-minified-heldout.js
      - name: Typecheck Int32 MBA research lane
        run: npx tsc --allowJs --checkJs --noEmit --strict --target ES2022 --module commonjs --moduleResolution node --types node --skipLibCheck sims/mba-author-int32-component-inverse.js sims/mba-author-int32-heldout.js sims/mba-author-int32-minified-recover.js sims/mba-author-int32-minified-heldout.js test/mba-author-int32-heldout.test.js test/mba-author-int32-minified-recover.test.js test/mba-author-int32-minified-heldout.test.js

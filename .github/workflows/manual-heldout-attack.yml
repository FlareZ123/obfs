name: Manual held-out ESM property-flow attack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jsconfuser-cff-assertion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies and exact JS-Confuser candidate
        run: npm install --no-package-lock --ignore-scripts js-confuser@2.1.3
      - name: Run preregistered CFF runtime-assertion pilot
        run: node sims/jsconfuser-runtime-assertion-pilot.js
      - name: Typecheck pilot
        run: npx tsc --allowJs --checkJs --noEmit --strict --target ES2022 --module commonjs --moduleResolution node --types node --skipLibCheck sims/jsconfuser-runtime-assertion-pilot.js

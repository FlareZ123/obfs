name: Manual held-out ESM property-flow attack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heldout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Held-out semantic differential and static attacker
        run: node --test test/heldout-object-flow-attack.test.js test/attacker-token-normalize.test.js
      - name: Emit attack and protection surface metrics
        run: node sims/heldout-object-flow-attack.js
      - name: Compare checker compiler on same held-out ESM graphs
        run: node sims/heldout-compiler-compare.js
      - name: Hot cross-file property-flow regression
        run: node --test test/property-hotpath-closedworld.test.js
      - name: Report measured protected hot loops and module cold startup
        run: node sims/property-hotpath-closedworld.js
      - name: Fixed private tuple differential, reconstruction, and cold-session checks
        run: node --test test/private-tuple-proof.test.js test/private-tuple-grid.test.js test/private-tuple-session.test.js test/private-record-proof.test.js test/private-record-grid.test.js

      - name: Report private tuple cold-through-hot end-to-end ratios
        run: node sims/private-tuple-session.js
      - name: Paired batched end-to-end COO cold-session budget
        run: node sims/private-container-session-profile.js
      - name: Check JSDoc types
        run: npm run typecheck

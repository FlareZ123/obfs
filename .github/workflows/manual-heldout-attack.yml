name: Manual held-out ESM property-flow attack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mba-int32-attacker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify frozen minified-source attacker
        run: node --test test/mba-author-int32-minified-recover.test.js
      - name: Typecheck frozen minified-source attacker
        run: npx tsc --allowJs --checkJs --noEmit --strict --target ES2022 --module commonjs --moduleResolution node --types node --skipLibCheck sims/mba-author-int32-component-inverse.js sims/mba-author-int32-minified-recover.js test/mba-author-int32-minified-recover.test.js

name: Agent 20 constructor-chain validator probe

on:
  push:
    branches:
      - agent20/constructor-chain-validator-probe-20261124

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute exact pre-guard validator probe
        run: node --test test/agent20-constructor-chain-validator-probe.test.js

name: Manual Agent6 scoped private-record Node contract (browser excluded)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-alias:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Agent 6 multi-owner record native differential and strict refusal
        run: node --test test/agent6-multi-slot-private-record-proof.test.js test/agent6-multi-slot-record-fuzz.test.js test/agent6-multi-slot-private-tuple-proof.test.js test/agent6-repeated-owner-symbol-keys.test.js test/private-record-proof.test.js test/private-tuple-proof.test.js
      - name: Agent 6 source-pinned real Chromium multi-slot ESM and 2.5x workload
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node test/agent6-multi-slot-record-browser.js
      - name: Agent 6 source-pinned real Chromium multi-slot tuple ESM and 2.5x workload
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node test/agent6-multi-slot-tuple-browser.js
      - name: Agent 6 additional external JSDoc gate
        run: npm run typecheck:external
      - name: Strict core and cross-file alias JSDoc
        run: |
          npm run typecheck
          npx tsc -p jsconfig.cross-identity.json
      - name: Source-ordered primitive const-value ESM owner and unsafe refusal tests
        run: node --test test/cross-file-primitive-const-value.test.js
      # A pre-existing primitive const-value browser yield oracle fails 0 != 2
      # at main-based source; it is independent of this private record patch.
      # Keep separate browser evidence, not a false green claim for that oracle.
      - name: Real Chromium primitive const-value owners versus ordinary minification
        if: ${{ false }}
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node test/cross-file-primitive-const-browser.js
      # Unrelated source-only browser gates are independently release-blocked
      # on this main-derived baseline; this dispatch asserts Node/ESM only.
      - name: Real Chromium nonthrowing unary BigInt owner and reflection parity
        if: ${{ false }}
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node test/bigint-unary-owner-browser.js
      # Unrelated source-only browser gates are independently release-blocked
      # on this main-derived baseline; this dispatch asserts Node/ESM only.
      - name: Real Chromium immutable import alias and reflection refusal
        if: ${{ false }}
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node test/cross-file-imported-identity-browser.js
      # Unrelated source-only browser gates are independently release-blocked
      # on this main-derived baseline; this dispatch asserts Node/ESM only.
      - name: Equal-trust esbuild property-mangle control in real Chromium
        if: ${{ false }}
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node test/cross-file-property-mangle-control.js
      - name: Identity alias positive and unsafe refusal differentials
        run: node --test test/cross-file-identity-return.test.js test/cross-file-imported-identity-alias.test.js test/cross-file-imported-identity-fuzz.test.js

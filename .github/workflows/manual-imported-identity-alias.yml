name: Manual Agent 6 PR384 integration full Node regression (isolated run)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-node:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full repository Node test corpus
        run: npm test
      - name: Strict JSDoc core
        run: npm run typecheck
      - name: Strict JSDoc external
        run: npm run typecheck:external

name: Manual imported pure-identity alias property proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-alias:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict core and cross-file alias JSDoc
        run: |
          npm run typecheck
          npx tsc -p jsconfig.cross-identity.json
      - name: Identity alias positive and unsafe refusal differentials
        run: node --test test/cross-file-identity-return.test.js test/cross-file-imported-identity-alias.test.js

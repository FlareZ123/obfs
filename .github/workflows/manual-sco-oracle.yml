name: Manual SCO authorized oracle extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorized-oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Test full finite-domain HMAC oracle clone with legitimate authorization
        run: node sims/sco-oracle-exhaustion.js
      - name: Attacker model and authenticated piecewise oracle regression
        run: node --test test/sco-piecewise-oracle.test.js
      - name: Emit eight randomized piecewise oracle attack outcomes
        run: node sims/sco-piecewise-oracle.js
      - name: Recover stateful private Mealy machine through authenticated proxy
        run: node --test test/sco-stateful-oracle.test.js
      - name: Print bounded stateful oracle reconstruction evidence
        run: node sims/sco-stateful-oracle.js
      - name: Learn step-only state machine through known synchronizing word
        run: node --test test/sco-synchronizing-oracle.test.js
      - name: Emit authenticated synchronizing-word attack results
        run: node sims/sco-synchronizing-oracle.js
      - name: Search for synchronizing input by observed step-only behavior
        run: node --test test/sco-sync-search.test.js
      - name: Print live authenticated SCO sync-word discovery evidence
        run: node sims/sco-discovered-oracle-run.js
      - name: Publish bounded sync-word search false-positive counts
        run: node sims/sco-sync-search-falsification.js
      - name: Challenge public-step-only SCO oracle with diversified synchronization search
        run: node --test test/sco-sync-diversified.test.js
      - name: Publish two-corpus physical and observational attack classifications
        run: node sims/sco-sync-diversified-report.js
      - name: Stress-test public-step-only synchronization on 2,000 models
        run: node sims/sco-sync-diversified-report.js --stress
      - name: Stress-test two independent heldout public SCO machine corpora
        run: node sims/sco-sync-diversified-report.js --stress --holdout
      - name: Verify independent four-state behavioral equivalence partition on 60000 cases
        run: node --test test/sco-mealy-refinement.test.js
      - name: Test fixed SCO public learner across different hidden-state sizes
        run: node --test test/sco-sync-state-size.test.js
      - name: Publish 4-12-state oracle-observability classifications
        run: node sims/sco-sync-state-size.js
      - name: Stress eight thousand public SCO machine workloads by state count
        run: node sims/sco-sync-state-size.js --stress
      - name: Test bounded adversarial suffix depth-versus-query cost
        run: node --test test/sco-sync-depth-sweep.test.js
      - name: Print 6-12-state attacker depth cost grid
        run: node sims/sco-sync-depth-sweep.js
      - name: Falsify SCO attacker on 1500 independent variable-state depth holdouts
        run: node sims/sco-sync-depth-sweep.js --stress --holdout
      - name: Test independently sampled SHA-256 Mealy oracle attack fixtures
        run: node --test test/sco-sync-independent-distribution.test.js
      - name: Measure independent SHA-256 oracle attack base distribution
        run: node sims/sco-sync-independent-distribution.js
      - name: Measure independent SHA-256 oracle attack holdout distribution
        run: node sims/sco-sync-independent-distribution.js --holdout
      - name: Verify independent short reset availability denominators
        run: node --test test/sco-sync-independent-ground-truth.test.js
      - name: Publish exhaustive short-word ground truth for SHA machine fixtures
        run: node sims/sco-sync-independent-ground-truth.js
      - name: Compare finite-domain cloning against high-entropy SCO keyed function
        run: node sims/sco-high-entropy-prf.js
      - name: Test low-entropy key recovery through authorized SCO RPC
        run: node sims/sco-key-search.js
      - name: Demonstrate forged Host routing and separate server authorization
        run: node --test test/sco-host-header-spoof.test.js
      - name: Verify committed SCO private and public sample matches compiler output
        run: node examples/sco-private/build-sample.cjs --check
      - name: Execute authenticated real before-and-after SCO example
        run: node --test test/sco-real-example.test.js
      - name: Recover SCO private state machine through generated ESM in real Chromium
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-sync-diversified-browser.js
      - name: Strict JSDoc check for all SCO state-machine attack simulators
        run: npx tsc -p jsconfig.sco-oracles.json
      - name: Strict JSDoc type safety
        run: npm run typecheck

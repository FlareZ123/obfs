name: Manual attacker token-normalizer differential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalizer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Verify claimed author CLI path and source-aware inverse
        run: node sims/mba-author-coreutils-static-recovery.js
      - name: Verify signed SMT rotation collision counterexample
        run: node sims/mba-author-smt-rotate-collision.js
      - name: Reproduce independent held-out permutation inverses
        run: node sims/mba-permutation-heldout-inverse.js
      - name: Reproduce minified-source static extraction
        run: node sims/mba-permutation-minified-static-recovery.js
      - name: Verify held-out minified static extraction
        run: node sims/mba-permutation-minified-heldout-recovery.js
      - name: Sample JS budget against slash control
        run: node sims/mba-permutation-js-budget.js
      - name: Strict external test JSDoc
        run: npm run typecheck:external
      - name: Strict compiler JSDoc
        run: npm run typecheck

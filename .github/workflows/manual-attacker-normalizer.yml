name: Manual attacker token-normalizer differential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalizer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Independent polynomial black-box reconstruction and inversion
        run: node sims/permutation-polynomial-blackbox.js
      - name: Three-stage polynomial xor-shift rotation source-blind decomposition
        run: node sims/permutation-polynomial-linear-shell-blackbox.js
      - name: Public-JavaScript sandwich instrumentation and held-out clone
        run: node sims/sandwich-imul-runtime-extraction.js
      - name: Strict external JavaScript JSDoc
        run: npm run typecheck:external
      - name: Strict compiler JSDoc
        run: npm run typecheck

name: Manual transformation semantics regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install exactly committed dependency resolutions
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate npm lock integrity and package-root synchronization
        run: node -e "const l=require('./package-lock.json');const p=require('./package.json');if(l.lockfileVersion!==3||l.packages[''].version!==p.version)process.exit(1);console.log('locked packages',Object.keys(l.packages).length)"
      - name: Execute real ESM semantics under frozen dependencies
        run: node --test test/imported-primitive-source-proof.test.js test/imported-primitive-graph-fuzz.test.js
      - name: Print exact toolchain and lock digest
        run: |
          node --version
          npm --version
          node -e "const fs=require('node:fs');const crypto=require('node:crypto');console.log(crypto.createHash('sha256').update(fs.readFileSync('package-lock.json')).digest('hex'))"

name: Manual transformation semantics regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Imported primitive constant proof and ESM native parity
        run: node --test test/imported-primitive-source-proof.test.js
      - name: Strict JSDoc type checking
        run: npm run typecheck
      - name: Strict external research JSDoc
        run: npm run typecheck:external

name: Manual transformation semantics regression
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate a resolved npm lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify the lock supports a clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print toolchain versions and generated lock digest
        run: |
          node --version
          npm --version
          sha256sum package.json package-lock.json
          npm ls --all --depth=0
      - name: Commit and push the frozen resolution only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Agent 15: Record resolved npm dependency graph"
          git push origin HEAD:${{ github.ref_name }}

name: Manual transformation semantics regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-four-way:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install frozen lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild and compare every byte of the committed four-way artifact set
        run: node --test test/frozen-four-way-artifacts.test.js
      - name: Strict research JSDoc
        run: npm run typecheck:external
      - name: Show committed archive JSON byte digest
        run: node -e "const fs=require('node:fs');const h=require('node:crypto').createHash('sha256');console.log('ARCHIVED_ARTIFACT_SHA256',h.update(fs.readFileSync('im-results/frozen-four-way-artifacts-2026-11-18.json')).digest('hex'))"

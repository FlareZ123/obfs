name: Manual WindowProxy reflected-loader ESM owner proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reflected-loader:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Native and obfuscated reflected Function constructor ESM consumer
        run: node --test test/windowproxy-reflected-function-loader.test.js
      - name: Production JSDoc
        run: npm run typecheck

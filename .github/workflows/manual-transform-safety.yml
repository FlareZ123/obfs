name: Manual transformation semantics regression
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze-four-way:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install the merged cross-platform dependency lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify frozen artifact generation and decoded files
        run: node --test test/frozen-four-way-artifacts.test.js
      - name: Strict external research JSDoc
        run: npm run typecheck:external
      - name: Emit all twelve exact native/control/published/recovered modules
        run: node sims/frozen-four-way-artifacts.js --output im-results/frozen-four-way-artifacts-2026-11-18.json
      - name: Save one reusable source-pinned Ubuntu receipt
        if: runner.os == 'Linux'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/frozen-four-way-artifacts-2026-11-18.json
          git commit -m "Agent 15: Archive byte-frozen four-way attacker comparison artifacts"
          git push origin HEAD:${{ github.ref_name }}

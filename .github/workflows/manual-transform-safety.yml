name: Manual transformation semantics regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Cross-mode pure imported primitive graphs and source-observer negatives
        run: node --test test/imported-primitive-source-proof.test.js test/imported-primitive-graph-fuzz.test.js

name: Manual transformation semantics regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  esbuild-binary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install current committed mainline lock without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute the actual esbuild platform binary
        run: node -e "const e=require('esbuild');console.log('esbuild',e.version,e.transformSync('export let x=5',{minify:true}).code)"

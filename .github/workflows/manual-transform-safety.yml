name: Manual transformation semantics regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-byte-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Validate committed package and lock byte hashes
        run: node -e "const fs=require('node:fs');const h=require('node:crypto').createHash;const sha=f=>h('sha256').update(fs.readFileSync(f)).digest('hex');console.log(sha('package.json'),sha('package-lock.json'));if(sha('package.json')!=='b44b55c11687602ebc7a78825bd734fcbe56a74ced00d6baf690b368427f94e1'||sha('package-lock.json')!=='539c99fa4525f96eaa4fef42b44a2d2fb5d4928e0831b7368b0a33d08551bc04')process.exit(1)"
      - name: Clean npm install from identical lock bytes
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate real ESM behavior under frozen graph
        run: node --test test/imported-primitive-source-proof.test.js test/imported-primitive-graph-fuzz.test.js
      - name: Record runtime and package manager
        run: |
          node --version
          npm --version

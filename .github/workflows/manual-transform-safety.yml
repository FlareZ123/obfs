name: Manual transformation semantics regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Source observation, ambient intrinsic and property semantics
        run: node --test test/ambient-array-reflective-alias.test.js test/ambient-string-alias.test.js test/ambient-string-reflective-alias.test.js test/ambient-string-intrinsic.test.js test/source-introspection-safety.test.js test/cross-file-source-introspection.test.js test/cross-file-source-byte-reader.test.js test/cross-file-source-observer-global.test.js test/sco-source-observation.test.js test/sco-interfile-source-observation.test.js test/reflective-source-fuzz.test.js test/semantic-boundaries.test.js test/property-reflection.test.js test/string-shadowing.test.js test/source-observer-coverage.test.js test/primitive-coercer-source-precision.test.js test/primitive-coercer-sample.test.js test/primitive-method-source-precision.test.js test/owned-constant-computed-key.test.js test/owned-constant-key-sample.test.js test/imported-constant-computed-key.test.js test/imported-constant-key-sample.test.js test/interfile-api-fuzz.test.js test/interfile-normalization-attack.test.js test/source-map-disclosure.test.js test/compressed-asset-disclosure.test.js test/source-map-json-escapes.test.js test/css-source-map-annotation.test.js test/wasm-source-map-annotation.test.js test/html-asset-disclosure.test.js test/svg-asset-disclosure.test.js test/inert-assets.test.js test/obfuscator.test.js test/local-identity-wrapper.test.js test/local-root-getter.test.js test/cross-file-local-identity.test.js test/destructuring-assignment-flow.test.js test/destructuring-assignment-grid.test.js
      - name: Verify exact compiler-emitted ESM imported-key graph
        run: node examples/imported-constant-key/build-sample.cjs
      - name: Differential imported-key ESM fuzz and static reconstruction
        run: node sims/imported-constant-key-fuzz.js
      - name: Verify exact computed-key sample and source-only attacker
        run: node examples/owned-constant-key/build-sample.cjs
      - name: Profile local constant-key native and emitted operations
        run: node sims/owned-constant-key-profile.js
      - name: Verify exact compiler-emitted before-and-after sample
        run: node examples/primitive-coercer/build-sample.cjs
      - name: Profile original and emitted primitive-coercer hot loops
        run: node sims/primitive-coercer-profile.js
      - name: Verify identifier names observable in V8 error messages
        run: node --test test/identifier-typeerror-spelling.test.js test/tdz-identifier-names.test.js
      - name: Report exact observer-driven property-coverage counts
        run: node sims/source-observer-coverage.js
      - name: Report unobserved opaque host source and stack contracts
        run: node sims/external-function-source-contract.js
      - name: Strict external research JSDoc
        run: npm run typecheck:external
      - name: Strict JSDoc type checking
        run: npm run typecheck

name: Manual SCO legacy decoder cross-runtime witness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Print selected native runtime versions
        run: |
          node --version
          google-chrome --version
      - name: Compare pinned native Node and Chromium decoder mappings
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-textdecoder-realm-browser.js
      - name: Compare native TextDecoder fatal errors and input diagnostics
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-textdecoder-fatal-diagnostics-browser.js

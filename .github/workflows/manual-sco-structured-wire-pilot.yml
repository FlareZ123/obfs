name: Manual SCO graph-wire exploratory profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cborx-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies and exact cbor-x codec
        run: npm install --no-package-lock --ignore-scripts cbor-x@1.6.9
      - name: Verify Chromium
        run: google-chrome --version
      - name: Run preregistered real Chromium and binary HTTP pilot
        run: node sims/sco-cborx-browser-http.js
      - name: Typecheck browser pilot
        run: npx tsc --allowJs --checkJs --noEmit --strict --target ES2022 --module commonjs --moduleResolution node --types node --skipLibCheck sims/sco-cborx-browser-http.js

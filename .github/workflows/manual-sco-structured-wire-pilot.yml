name: Manual SCO graph-wire exploratory profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-identity-envelope:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Run preregistered JSON identity-envelope pilot
        run: node sims/sco-json-identity-envelope-pilot.js
      - name: Typecheck identity-envelope pilot
        run: npx tsc --allowJs --checkJs --noEmit --strict --target ES2022 --module commonjs --moduleResolution node --types node --skipLibCheck sims/sco-json-identity-envelope-pilot.js

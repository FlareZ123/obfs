name: Manual SCO graph-wire exploratory profile

on:
  workflow_dispatch:
    inputs:
      readonly_identity_only:
        description: Run only the read-only identity-token pilot
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared project dependencies and exact experimental codec
        if: ${{ !inputs.readonly_identity_only }}
        run: npm install --no-package-lock --ignore-scripts @ungap/structured-clone@1.4.0 devalue@6.0.3
      - name: Compare devalue graph transport against native and JSON value work
        if: ${{ !inputs.readonly_identity_only }}
        run: node sims/sco-devalue-wire-pilot.js
      - name: Bound hostile graph wire parser probes
        if: ${{ !inputs.readonly_identity_only }}
        run: node sims/sco-devalue-untrusted-parser-grid.js
      - name: Real Chromium devalue module bootstrap and repeated compute
        if: ${{ !inputs.readonly_identity_only && runner.os == 'Linux' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/sco-devalue-browser-profile.js
      - name: Independently test structured-clone JSON wire and document negative controls
        if: ${{ !inputs.readonly_identity_only }}
        run: node sims/sco-structured-wire-pilot.js
      - name: Install declared project dependencies for read-only identity pilot
        if: ${{ inputs.readonly_identity_only }}
        run: npm ci --ignore-scripts
      - name: Strict JSDoc for read-only identity pilot
        if: ${{ inputs.readonly_identity_only }}
        run: npx tsc -p jsconfig.sco-readonly-identity.json
      - name: Run read-only identity-token semantic and paired CPU pilot
        if: ${{ inputs.readonly_identity_only }}
        run: node sims/sco-readonly-identity-envelope-pilot.js

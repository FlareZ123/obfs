name: Manual SCO graph-wire exploratory profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cborx-edge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies and exact cbor-x codec
        run: npm install --no-package-lock --ignore-scripts cbor-x@1.6.9
      - name: Run preregistered edge and hostile-input boundary
        run: node sims/sco-cborx-edge-boundary.js
      - name: Typecheck edge boundary
        run: npx tsc --allowJs --checkJs --noEmit --strict --target ES2022 --module commonjs --moduleResolution node --types node --skipLibCheck sims/sco-cborx-edge-boundary.js

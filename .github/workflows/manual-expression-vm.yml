name: Manual nested expression VM verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expression-vm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Focused differential, generated-sample, and static-attacker regressions
        run: node --test test/expression-vm.test.js test/expression-vm-static-recovery.test.js test/native-graph.test.js test/native-graph-static-recovery.test.js test/expression-graph-fuzz.test.js test/statement-flow.test.js test/statement-flow-compact.test.js test/statement-flow-recovery-scale.test.js test/statement-flow-random-joins.test.js
      - name: Scaled public-only native CFG decompilation
        run: node sims/statement-flow-attack-scaling.js
      - name: Strict main-library JSDoc check
        run: npm run typecheck
      - name: Real Chromium ESM and page-owned API execution
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/expression-vm-browser.js

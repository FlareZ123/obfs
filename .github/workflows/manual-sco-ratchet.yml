name: Manual SCO stateful-ratchet architecture evaluation

on:
  workflow_dispatch:
    inputs:
      webauthn_boundary_only:
        description: Run only the real-Chromium WebAuthn-to-SCO bearer-session boundary
        type: boolean
        default: false
      proof_cpu_only:
        description: Compare server-only WebAuthn proof verification CPU for small and coarse workloads
        type: boolean
        default: false
      proof_batch_cpu_only:
        description: Compare server-only WebAuthn proof once per 32 or 128 original operations
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ratchet:
    if: ${{ !inputs.webauthn_boundary_only && !inputs.proof_cpu_only && !inputs.proof_batch_cpu_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Check main implementation JSDoc
        run: npm run typecheck
      - name: Check external experiment JSDoc
        run: npm run typecheck:external
      - name: Real SCO per-account ratchet and independent public client
        run: node sims/sco-ratchet-boundary.js
      - name: Actual generated batch facade vs independent attacker and 25ms budget
        run: node sims/sco-ratchet-batch-candidate.js
      - name: Equal-trust esbuild-minified and generated client attacker and 2.5x control
        run: node sims/sco-ratchet-minifier-control.js
      - name: Anonymous downstream uses authorized A proxy to clone live state
        run: node sims/sco-ratchet-online-relay.js
      - name: Lost-response strict failure vs idempotent last-result recovery
        run: node sims/sco-ratchet-retry-candidate.js
      - name: Same-root multi-replica ratchet and idempotent-cache split-brain
        run: node sims/sco-ratchet-replica-splitbrain.js
      - name: SQLite transactional ratchet repair and independent child races
        run: node sims/sco-ratchet-transactional-repair.js
      - name: Two independent actual SCO HTTP replicas with local SQLite admission
        run: node sims/sco-ratchet-transactional-http.js
      - name: Killed independent worker at SQLite pre/post commit boundaries
        run: node sims/sco-ratchet-transactional-crash.js
      - name: Authorized A CPU flood cross-account B 2.5x contention witness
        run: node sims/sco-ratchet-cross-account-contention.js
      - name: Per-principal resident worker isolation performance pilot
        run: node sims/sco-ratchet-worker-isolation-pilot.js
      - name: Certificate-validated reused vs fresh TLS 1.3 budget
        run: node sims/sco-ratchet-tls-cost.js
      - name: Real Chromium HttpOnly session CSP and native output parity
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-ratchet-batch-browser.js
      - name: Hostile Chromium fetch instrumentation with HttpOnly session
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-ratchet-browser-attacker.js
      - name: Matched generated and minified facade hostile Chromium A-only interception
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-ratchet-browser-equal-trust.js
      - name: Hostile Chromium reuses non-extractable WebCrypto proof-of-possession key
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-webcrypto-proof-of-possession-browser.js
      - name: WebAuthn RP binding versus hostile allowed-origin assertion
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-webauthn-origin-boundary-browser.js

  webauthn-boundary:
    if: ${{ inputs.webauthn_boundary_only && !inputs.proof_cpu_only && !inputs.proof_batch_cpu_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify production SCO WebAuthn assertion admission, replay and HTTP RPC gating
        run: node --test test/sco-webauthn-admission.test.js
      - name: Production SCO admission using real Chromium WebAuthn virtual authenticator
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-webauthn-admission-browser.js
      - name: Browser WebAuthn origin, session, and real SCO RPC boundary
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-webauthn-origin-boundary-browser.js
      - name: Strict project JSDoc
        run: npm run typecheck
      - name: Strict external JSDoc
        run: npm run typecheck:external

  webauthn-proof-cpu:
    if: ${{ inputs.proof_cpu_only && !inputs.proof_batch_cpu_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Paired Node server-only proof verification CPU ratio
        run: node --test test/sco-webauthn-proof-cpu-budget.test.js
      - name: Strict external JSDoc
        run: npm run typecheck:external

  webauthn-proof-batch-cpu:
    if: ${{ inputs.proof_batch_cpu_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Paired server-side proof once per original operation group
        run: node --test test/sco-webauthn-proof-batch-cpu.test.js
      - name: Strict external JSDoc
        run: npm run typecheck:external

name: Manual VM hybrid overhead

on:
  workflow_dispatch:

jobs:
  node22:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Differential proof-subset VM tests
        run: node --test test/vm-immediate-lowering.test.js test/vm-static-recovery.test.js test/expr-vm.test.js test/expr-vm-static-recovery.test.js test/mba-i32-lowering.test.js test/mba-static-recovery.test.js
      - name: Full JS typecheck
        run: npm run typecheck
      - name: Measure pure numeric VM hot and cold ratios
        run: node sims/vm-hybrid-ratio.js
      - name: Measure seeded MBA direct-expression hot ratios
        run: node sims/mba-i32-profile.js

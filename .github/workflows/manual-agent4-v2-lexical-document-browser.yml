name: Manual Agent4 V2 lexical Document strict-CSP browser differential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source-pinned real Chromium lexical Document and hostile setter parity
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/agent4-v2-inert-lexical-document-browser.js
      - name: Source-pinned Node 22 semantic differential and positive rename yield
        run: node --test test/agent4-v2-inert-lexical-document.test.js
      - name: Strict JSDoc
        run: npm run typecheck
      - name: Strict external tooling JSDoc
        run: npm run typecheck:external

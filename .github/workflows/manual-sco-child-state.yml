name: Manual SCO private child primitive-prototype admission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Run implicit prototype falsifier
        run: node --test test/sco-private-child-primitive-prototype-read.test.js
      - name: Strict SCO oracle JSDoc
        run: npx tsc -p jsconfig.sco-oracles.json
      - name: Strict project JSDoc
        run: npm run typecheck

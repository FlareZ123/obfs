name: Manual historical WindowProxy eager-decoder negative control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-browser-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Actual Chromium native/prepatch generated divergence
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/decoder-windowproxy-historical-negative-browser.js

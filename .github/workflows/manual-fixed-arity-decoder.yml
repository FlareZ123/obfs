name: Manual fixed-arity long-string decoder research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decoder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Fixed-arity and neighboring string differential tests
        run: node --test test/fixed-arity-strings.test.js test/chunked-strings.test.js test/static-string-recovery.test.js
      - name: Paired exact-source runtime and static attacker profile
        run: node sims/fixed-arity-decoder-profile.js
      - name: Real Chromium fixed-arity compatibility and static recovery
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/fixed-arity-strings-browser.js
      - name: Chromium cold COO ESM source-versus-emitted session profile
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/fixed-arity-browser-session.js
      - name: Strict production JSDoc
        run: npm run typecheck
      - name: Strict fixed-arity research JSDoc
        run: npx tsc -p jsconfig.fixed-arity.json
      - name: Source-visible String and Array prototype parity with positive decoder yield
        run: node --test test/decoder-array-prototype-chain.test.js test/decoder-opaque-prototype-source.test.js

      - name: Interprocedural alias red proof
        run: node --test test/decoder-interprocedural-alias.test.js

      - name: Shadowed intrinsic exact output and positive-yield matrix
        run: node --test test/decoder-shadowed-intrinsic.test.js

      - name: Tagged and wrapped opaque intrinsic argument differential
        run: node --test test/decoder-wrapped-escape.test.js

      - name: Expression-wrapper intrinsic argument parity and positive yield
        run: node --test test/decoder-expression-wrapper.test.js

      - name: Returned function intrinsic and read-only positive coverage
        run: node --test test/decoder-returned-alias.test.js
      - name: Nested if try switch return and scoped alias proof
        run: node --test test/decoder-returned-branches.test.js

      - name: Container-stored intrinsic field alias red and positive-yield gate
        run: node --test test/decoder-container-alias.test.js

      - name: Container destructuring intrinsic provenance red and positive-yield gate
        run: node --test test/decoder-container-destructure.test.js

      - name: Cross-file CommonJS decoder intrinsic provenance red and positive-yield gate
        run: node --test test/decoder-crossfile-container.test.js

      - name: Nested and whole container intrinsic provenance red and positive-yield gate
        run: node --test test/decoder-nested-container.test.js

      - name: Post-construction container field provenance red and positive-yield gate
        run: node --test test/decoder-container-write.test.js

      - name: Cross-file ESM decoder export provenance red and positive-yield gate
        run: node --test test/decoder-esm-export.test.js

      - name: Reverse alias container field provenance red and positive-yield gate
        run: node --test test/decoder-container-alias-write.test.js

      - name: Reflective container field write provenance red and positive-yield gate
        run: node --test test/decoder-reflective-container-write.test.js

      - name: Returned reflective container provenance red and positive-yield gate
        run: node --test test/decoder-reflective-return-container.test.js

      - name: Prototype-linked reflective container provenance red and positive-yield gate
        run: node --test test/decoder-reflective-prototype-container.test.js

      - name: Returned spread container provenance red and positive-yield gate
        run: node --test test/decoder-returned-spread-container.test.js

      - name: Accessor container provenance red and positive-yield gate
        run: node --test test/decoder-accessor-container.test.js

      - name: Accessor write container provenance red and positive-yield gate
        run: node --test test/decoder-accessor-write-container.test.js

      - name: Indirect legacy getter call provenance red and positive-yield gate
        run: node --test test/decoder-legacy-getter-call.test.js

      - name: Browser WindowProxy decoder-alias differential and positive-yield control
        run: node --test test/decoder-browser-window-alias.test.js

      - name: Real Chromium WindowProxy intrinsic alias and protected-work parity
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/decoder-browser-window-alias-browser.js

      - name: WindowProxy-mediated long-string String and Array mutation differential
        run: node --test test/decoder-windowproxy-chunked.test.js

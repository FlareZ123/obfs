name: Manual output-rank certificate proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank-witness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source-only lower-rank witness and false-certification controls
        run: node --test test/affine-output-rank-certificate.test.js
      - name: Strict JSDoc for lower-rank certificate and inversion
        run: node node_modules/typescript/bin/tsc -p jsconfig.affine-low-rank-oracle.json

name: Manual cross-file property reader proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source-isolated exact compiler byte parity and CPU A/B
        run: node sims/cross-file-parse-ab.js
      - name: Imported string and reader graph differentials
        run: node --test test/imported-constant-computed-key.test.js test/cross-file-reader-flow.test.js test/cross-file-safe-record-read.test.js test/cross-file-source-introspection.test.js test/cross-default-export-properties.test.js
      - name: Strict compiler typecheck
        run: npm run typecheck
      - name: Strict external corpus typecheck
        run: npm run typecheck:external

name: Manual cross-file property reader proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Cross-file differential and negative cases
        run: node --test test/cross-default-export-properties.test.js test/local-root-getter.test.js test/cross-file-local-identity.test.js test/cross-file-reader-flow.test.js test/cross-file-reader-matrix.test.js test/cross-file-identity-return.test.js test/cross-file-identity-grid.test.js test/cross-file-safe-record-read.test.js test/closed-record-host-formal-provenance.test.js test/cross-reflection.test.js test/cross-file-ambiguity.test.js test/cross-file-source-introspection.test.js test/cross-file-absolute-url.test.js test/cross-file-hash-collision.test.js test/cross-file-source-byte-reader.test.js test/node-loader-source-reader.test.js test/module-registry-source-reader.test.js test/module-registry-source-sample.test.js test/imported-constant-computed-key.test.js
      - name: Verify exact immediate-owner getter before/after ESM artifact
        run: node examples/direct-owner-read/build-sample.cjs
      - name: Native and emitted ESM host-lock graph behavior
        run: node --test test/closed-graph-host-lock.test.js test/obfuscator.test.js
      - name: Verify generated multi-module host lock before/after graph
        run: node examples/closed-graph-host/build-sample.cjs
      - name: Reproduce public-only guard removal attack
        run: node sims/closed-graph-host-bypass.js
      - name: Profile original versus guarded whole-process workloads
        run: node sims/closed-graph-host-cost.js
      - name: Real Chromium ESM graph authorized and denied origins
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/closed-graph-host-browser.js
      - name: Independent Chromium import-map pre-guard dependency attack
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/closed-graph-host-import-map-attack.js
      # Red-first compatibility probe: new DOM serializations can observe
      # inline script text even where the current source guard may miss it.
      # This is an evidence branch, not a new release gate.
      - name: Browser inline ESM import-graph DOM source-boundary parity
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/browser-dom-module-graph-source-boundary.js
      - name: Browser DOM serialization source-observer native/emitted parity
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/browser-dom-source-serialization-pair.js
      # The historical computed-refusal ablation is source-anchored to a
      # removed compiler clause and cannot run against modern main; its pinned
      # counterfactual evidence remains in sims/computed-refusal-ablation.js.
      - name: Source-only normalization of real host-locked SCO variants
        run: node --test test/sco-variant-normalize.test.js
      - name: Strict external researcher and diagnostic JSDoc
        run: npx tsc -p jsconfig.external.json
      - name: Strict JSDoc type safety
        run: npm run typecheck

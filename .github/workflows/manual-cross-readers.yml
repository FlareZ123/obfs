name: Manual cross-file property reader proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Named immutable ESM key provenance differential and regression
        run: node --test test/imported-constant-computed-key.test.js
      - name: Reader/identity and source-observer regression
        run: node --test test/cross-file-reader-flow.test.js test/cross-file-safe-record-read.test.js test/cross-file-source-introspection.test.js
      - name: Strict external research JSDoc
        run: npm run typecheck:external
      - name: Strict compiler JSDoc
        run: npm run typecheck

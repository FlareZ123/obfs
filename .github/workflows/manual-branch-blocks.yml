name: Manual branch superblock experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-blocks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Generate real before-and-after sample
        run: node examples/branch-blocks/build.cjs
      - name: Branch differential semantics
        run: node --test test/branch-blocks.test.js test/branch-block-reconstruction.test.js test/branch-block-layered.test.js
      - name: Seedless attacker reconstruction
        run: node sims/branch-block-reconstruction.js
      - name: Held-out seeded attacker corpus
        run: node sims/branch-block-recovery-corpus.js
      - name: Public ciphertext-bit tamper attack
        run: node sims/branch-block-tamper.js
      - name: Six-trial isolated performance profile
        env:
          OBFS_ENFORCE_BUDGET: '1'
        run: node sims/branch-block-profile.js
      - name: Real Chromium COO differential
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/branch-block-browser.js
      - name: JSDoc checker
        run: npm run typecheck


  branch-blocks-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Generate actual before and after
        run: node examples/branch-blocks/build.cjs
      - name: Semantic, layered ESM, masked-state recovery regressions
        run: node --test test/branch-blocks.test.js test/branch-block-reconstruction.test.js test/branch-block-layered.test.js
      - name: Held-out seeded attacker corpus
        run: node sims/branch-block-recovery-corpus.js
      - name: Public ciphertext-bit tamper attack
        run: node sims/branch-block-tamper.js
      - name: Six-trial plain and masked hot performance
        env:
          OBFS_ENFORCE_BUDGET: '1'
        run: node sims/branch-block-profile.js
      - name: Strict JSDoc
        run: npm run typecheck

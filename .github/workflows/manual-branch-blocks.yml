name: Manual branch superblock experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-blocks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Generate real before-and-after sample
        run: node examples/branch-blocks/build.cjs
      - name: Branch differential semantics
        run: node --test test/branch-blocks.test.js test/branch-block-reconstruction.test.js test/branch-block-layered.test.js test/statement-flow.test.js test/statement-flow-multifile.test.js test/statement-flow-cli.test.js test/statement-flow-host-bypass.test.js
      - name: Regenerate multi-statement before-and-after artifact
        run: node examples/statement-flow/build.cjs
      - name: Seedless attacker reconstruction
        run: node sims/branch-block-reconstruction.js
      - name: Held-out seeded attacker corpus
        run: node sims/branch-block-recovery-corpus.js
      - name: Public ciphertext-bit tamper attack
        run: node sims/branch-block-tamper.js
      - name: Public browser-lock bypass under simulated Node origin
        run: node sims/branch-block-host-bypass.js
      - name: Six-trial isolated performance profile
        env:
          OBFS_ENFORCE_BUDGET: '1'
        run: node sims/branch-block-profile.js
      - name: Held-out 160-graph statement CFG differential and static attack
        run: node sims/statement-flow-fuzz.js
      - name: Hostile external callback and exceptional iterator source-only CFG differential
        run: node --test test/statement-flow-ambient-callback-fuzz.test.js
      - name: Strict JSDoc for hostile-host callback graph challenger
        run: npx tsc -p jsconfig.statement-flow-ambient.json
      - name: Source-only statement tamper against distributed dispatcher
        run: node sims/statement-flow-tamper.js
      - name: Full COO layered seedless attacker recovery cost
        run: node sims/statement-flow-attack-cost.js
      - name: Statement CFG native-versus-host callback workload profile
        run: node sims/statement-flow-profile.js
      - name: Tiny hot arithmetic CFG overhead diagnostic
        run: node sims/statement-flow-pure-hot.js
      - name: Statement CFG source-size and cold JavaScript compile profile
        run: node sims/statement-flow-cold.js
      - name: Real Chromium multi-statement CFG native differential
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/statement-flow-browser.js
      - name: Real Chromium COO differential
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/branch-block-browser.js
      - name: JSDoc checker
        run: npm run typecheck


  branch-blocks-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Generate actual before and after
        run: node examples/branch-blocks/build.cjs
      - name: Semantic, layered ESM, masked-state recovery regressions
        run: node --test test/branch-blocks.test.js test/branch-block-reconstruction.test.js test/branch-block-layered.test.js test/statement-flow.test.js test/statement-flow-multifile.test.js test/statement-flow-cli.test.js test/statement-flow-host-bypass.test.js
      - name: Held-out seeded attacker corpus
        run: node sims/branch-block-recovery-corpus.js
      - name: Public ciphertext-bit tamper attack
        run: node sims/branch-block-tamper.js
      - name: Public browser-lock bypass under simulated Node origin
        run: node sims/branch-block-host-bypass.js
      - name: Six-trial plain and masked hot performance
        env:
          OBFS_ENFORCE_BUDGET: '1'
        run: node sims/branch-block-profile.js
      - name: Held-out 160-graph statement CFG differential and static attack
        run: node sims/statement-flow-fuzz.js
      - name: Source-only statement tamper against distributed dispatcher
        run: node sims/statement-flow-tamper.js
      - name: Full COO layered seedless attacker recovery cost
        run: node sims/statement-flow-attack-cost.js
      - name: Statement CFG native-versus-host callback workload profile
        run: node sims/statement-flow-profile.js
      - name: Tiny hot arithmetic CFG overhead diagnostic
        run: node sims/statement-flow-pure-hot.js
      - name: Statement CFG source-size and cold JavaScript compile profile
        run: node sims/statement-flow-cold.js
      - name: Strict JSDoc
        run: npm run typecheck

name: Manual SCO nested verified-principal queue CPU profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-quota-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Main strict JSDoc
        run: npm run typecheck
      - name: External research strict JSDoc
        run: npm run typecheck:external
      - name: Matched 1-16-64 event original vs one-level vs nested queue CPU
        run: node sims/sco-ratchet-nested-quota-cpu.js

name: Manual closed-graph host lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-graph:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Strict compiler JSDoc
        run: npm run typecheck
      - name: Native and emitted ESM host-lock graph behavior
        run: node --test test/closed-graph-host-lock.test.js test/obfuscator.test.js

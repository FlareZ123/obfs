name: Manual SCO account-sharded state differential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard-differential:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Check implementation JSDoc
        run: npm run typecheck
      - name: Check external experiment JSDoc
        run: npm run typecheck:external
      - name: Authenticated account-sharded SCO HTTP cross-process differential
        run: node sims/sco-ratchet-account-shards.js
      - name: Same-process authenticated A CPU blocking B despite storage shards
        run: node sims/sco-ratchet-shards-eventloop.js
      - name: Account-shard first-use resource and computation cost
        run: node sims/sco-ratchet-shard-cold-admission.js
      - name: Root-keyed fixed-bucket collision and WAL-footprint differential
        run: node sims/sco-ratchet-bucket-shards.js
      - name: Per-verified-principal capacity versus colliding-bucket queue negative
        run: node sims/sco-ratchet-bucket-quota-identity.js

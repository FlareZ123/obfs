name: Default ESM frame source-observation adversary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-reader:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Execute real Chrome same-origin frame source reader
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node sims/default-browser-frame-source-observer.js --expect-red
      - name: Validate root JSDoc
        run: npm run typecheck
      - name: Validate external JSDoc
        run: npm run typecheck:external

name: One-shot historical positive-yield control

on:
  push:
    paths:
      - '.github/workflows/one-shot-reflect-source.yml'

permissions:
  contents: read

jobs:
  historical-positive-yield:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '590886bea779c34b0f3552d0bd58ebafaf8bd832'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install historically declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Reproduce five positive-yield regressions before Agent 3 source repairs
        continue-on-error: true
        run: node --test --test-reporter=spec test/application-challenge-null-prototype-yield.test.js test/application-challenge-token-neutralize.test.js test/cross-file-reader-flow.test.js test/ownkey-comment-static-recovery.test.js test/quoted-module-names.test.js

name: One-shot reflective sources and primitive-coercion parity

on:
  push:
    paths:
      - '.github/workflows/one-shot-reflect-source.yml'

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Reflective native source-observation regressions
        run: node --test test/reflect-construct-function-source-observer.test.js test/regexp-flag-function-source-observer.test.js test/reflect-construct-interfile-source.test.js test/imported-primitive-source-proof.test.js
      - name: Compact full-suite differential and adversarial triage
        continue-on-error: true
        run: node sims/ci-brief-failures.js
      - name: Strict project JSDoc
        run: npm run typecheck
      - name: Strict external JSDoc
        run: npm run typecheck:external
      - name: Sample performance
        run: npm run benchmark
      - name: Real Chromium integration
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: npm run test:browser

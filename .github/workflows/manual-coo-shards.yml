name: Manual COO shared-string sharding research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Native ESM differential and offline recovery
        run: node --test test/coo-shard-strings.test.js
      - name: Reproduce committed before and after samples
        run: node examples/coo-shards/build.cjs --check
      - name: Cold-graph and hot-path paired performance research
        run: node sims/coo-shard-profile.js
      - name: Strict JSDoc typecheck for experimental source and tests
        run: npx tsc -p jsconfig.coo-shards.json
      - name: Existing-edge piggyback ESM semantic regressions
        run: node --test test/coo-piggyback-shards.test.js
      - name: Verify checked-in piggyback output matches current compiler
        run: node examples/coo-piggyback/build.cjs
      - name: Strict JSDoc for existing-edge piggyback backend
        run: npx tsc -p jsconfig.piggyback.json
      - name: Existing-edge piggyback cold and hot cost sample
        run: node sims/coo-piggyback-profile.js

name: Agent19 User Timing source-changing Wasm counterfactual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify actual native User Timing and selected-Wasm source collision
        run: node --test test/agent19-user-timing-wasm-counterfactual.test.js
      - name: Strict JSDoc type check
        run: npm run typecheck

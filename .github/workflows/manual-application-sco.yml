name: Manual frozen application SCO source-withholding and relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-private-application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Emit actual single public facade and inspect exact bytes
        run: node examples/application-challenge/sco-build.cjs --check --dump
      - name: Test source withholding, authorization, online relay, and paired costs
        run: node --test test/application-challenge-sco.test.js

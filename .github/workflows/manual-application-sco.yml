name: Manual frozen application SCO source-withholding and relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-private-application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Emit actual single public facade and inspect exact bytes
        run: node examples/application-challenge/sco-build.cjs --check --dump
      - name: Test source withholding, authorization, online relay, and paired costs
        run: node --test test/application-challenge-sco.test.js
      - name: Validate exact finite-sample paired slowdown inference
        run: node --test test/paired-budget-bound.test.js
      - name: Compare real fresh-process full-session client costs
        run: node sims/application-challenge-sco-cold-session.js
      - name: Reproduce pinned cold-profile sample uncertainty
        run: node sims/application-challenge-sco-cold-bootstrap.js
      - name: Exact paired-ratio reanalysis of prior pinned SCO cold samples
        run: node sims/application-challenge-sco-order-stat-reanalysis.js
      - name: Reproduce source-pinned post-hardening cold-profile uncertainty
        run: node sims/application-challenge-sco-post-hardening-bootstrap.js
      - name: Strict JSDoc for finite-sample paired budget bound
        run: npx tsc --project jsconfig.paired-budget.json
      - name: Execute private SCO application facade in real Chromium
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/application-challenge-sco-browser.js

name: Experimental polyvariant affine evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Differential and integration cases
        run: node --test test/polyvariant-affine.test.js test/polyvariant-affine-fuzz.test.js test/polyvariant-affine-cli.test.js test/polyvariant-app.test.js
      - name: Emit real three-file application outputs as JSON
        run: node examples/polyvariant-app/build.cjs --emit-json
      - name: Verify exact checked-in multi-file application output
        run: node examples/polyvariant-app/build.cjs
      - name: Run attacker-only functional clone off host
        run: node sims/polyvariant-app-functional-clone.js
      - name: Reconstruct native math from public bytes and execute rebuilt full offline app
        run: node --test test/polyvariant-app-static-clone.test.js
      - name: Report offline static reconstruction from distributed module
        run: node sims/polyvariant-app-static-clone.js
      - name: Sample generated output (base64)
        run: node -e "const {execFileSync}=require('node:child_process'); const code=execFileSync(process.execPath,['examples/polyvariant-affine/build.js','--emit']); process.stdout.write('SAMPLE_B64='+code.toString('base64')+'\\n')"
      - name: Validate checked-in before-after sample
        run: node examples/polyvariant-affine/build.js
      - name: Verify source-only reconstruction attack
        run: node sims/polyvariant-affine-static-recover.js
      - name: Measure deterministic dense and mixed protected workloads
        run: node sims/polyvariant-affine-benchmark.js
      - name: Measure fresh parse and compilation overhead
        run: node sims/polyvariant-affine-cold-start.js
      - name: Measure startup-inclusive end-to-end short and long COO sessions
        run: node sims/polyvariant-affine-session-budget.js
      - name: Measure full three-module app import and stateful workload cost
        run: node sims/polyvariant-app-budget.js
      - name: Real Chromium COO ES module and host observation
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/polyvariant-affine-browser.js
      - name: JSDoc static check
        run: npm run typecheck

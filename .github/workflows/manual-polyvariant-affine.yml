name: Experimental polyvariant affine evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Differential and integration cases
        run: node --test test/polyvariant-affine.test.js
      - name: Sample generated output (base64)
        run: node -e "const {execFileSync}=require('node:child_process'); const code=execFileSync(process.execPath,['examples/polyvariant-affine/build.js','--emit']); process.stdout.write('SAMPLE_B64='+code.toString('base64')+'\\n')"
      - name: JSDoc static check
        run: npm run typecheck

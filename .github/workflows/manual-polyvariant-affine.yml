name: Experimental polyvariant affine evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Differential and integration cases
        run: node --test test/polyvariant-affine.test.js test/polyvariant-affine-fuzz.test.js test/polyvariant-affine-cli.test.js test/polyvariant-app.test.js
      - name: Emit real three-file application outputs as JSON
        run: node examples/polyvariant-app/build.cjs --emit-json
      - name: Verify exact checked-in multi-file application output
        run: node examples/polyvariant-app/build.cjs
      - name: Run attacker-only functional clone off host
        run: node sims/polyvariant-app-functional-clone.js
      - name: Reconstruct native math from public bytes and execute rebuilt full offline app
        run: node --test test/polyvariant-app-static-clone.test.js
      - name: Report offline static reconstruction from distributed module
        run: node sims/polyvariant-app-static-clone.js
      - name: Rebuild 24 previously unseen source-only application variants
        run: node --test test/polyvariant-app-heldout-seeds.test.js
      - name: Report 24 independent public-source application rebuilds
        run: node sims/polyvariant-app-heldout-seeds.js
      - name: Confirm three-query independent black-box translation clone and controls
        run: node --test test/polyvariant-app-oracle-translation.test.js
      - name: Emit original/public/cloned full ESM parity and exact chosen-query evidence
        run: node sims/polyvariant-app-oracle-translation.js
      - name: Sample generated output (base64)
        run: node -e "const {execFileSync}=require('node:child_process'); const code=execFileSync(process.execPath,['examples/polyvariant-affine/build.js','--emit']); process.stdout.write('SAMPLE_B64='+code.toString('base64')+'\\n')"
      - name: Validate checked-in before-after sample
        run: node examples/polyvariant-affine/build.js
      - name: Verify source-only reconstruction attack
        run: node sims/polyvariant-affine-static-recover.js
      - name: Measure deterministic dense and mixed protected workloads
        run: node sims/polyvariant-affine-benchmark.js
      - name: Measure fresh parse and compilation overhead
        run: node sims/polyvariant-affine-cold-start.js
      - name: Measure startup-inclusive end-to-end short and long COO sessions
        run: node sims/polyvariant-affine-session-budget.js
      - name: Exact finite-sample paired-ratio budget tests
        run: node --test test/paired-budget-bound.test.js
      - name: Measure full three-module app import and stateful workload cost
        run: node sims/polyvariant-app-budget.js
      - name: Count selected function executions in native, published, and rebuilt application
        run: node --test test/polyvariant-app-execution-coverage.test.js
      - name: Report independent source-only attacker execution coverage
        run: node sims/polyvariant-app-execution-coverage.js
      - name: Compare three full application ESM graphs and source-only attacker rebuild
        run: node --test test/polyvariant-app-three-way-budget.test.js
      - name: Emit paired native, public and reconstructed full-session cost evidence
        run: node sims/polyvariant-app-three-way-budget.js
      - name: Real Chromium COO ES module and host observation
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/polyvariant-affine-browser.js
      - name: Real Chromium native, distributed and independent rebuilt full ESM applications
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/polyvariant-app-three-way-browser.js
      - name: Validate cold Chromium schedule and clock-control construction
        run: node --test test/polyvariant-app-cold-browser-plan.test.js
      - name: Cold Chromium full-graph import, execution and callback budget
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node test/polyvariant-app-cold-browser.js
      - name: JSDoc static check
        run: npm run typecheck
      - name: JSDoc static check of execution-coverage experiment
        run: npx tsc --project jsconfig.polyvariant-coverage.json
      - name: JSDoc static check of paired-budget bound
        run: npx tsc --project jsconfig.paired-budget.json
      - name: Strict JSDoc check for black-box attacker and external corpus
        run: npm run typecheck:external
      - name: Strict JSDoc for three-observation runtime reconstruction
        run: npx tsc --project jsconfig.coo-runtime-probe.json
      - name: Independently reconstruct COO math from only three public runtime probes
        run: node --test test/coo-runtime-one-query-reconstruct.test.js
      - name: Browser-hosted one-output-per-export affine reconstruction
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/coo-runtime-one-query-browser.js

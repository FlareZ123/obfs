name: Manual low-rank target inversion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Low-rank target-inversion regressions
        run: node --test --test-reporter=spec test/low-rank-maximal-deficiency-inversion.test.js test/low-rank-target-guided-subspace-growth.test.js test/low-rank-exhaustive-width3.test.js test/public-affine-residual-target-inverter32.test.js
      - name: Independent exhaustive and seeded 4-bit peer verification
        run: node --test test/public-residual-independent-review.test.js
      - name: Independent seeded 5/6-bit multi-repair and inverse-space verification
        run: node --test test/public-residual-width5-6-independent.test.js
      - name: Independent full-target r-equals-nullity width-8/10 regression
        run: node --test test/public-residual-maximal-nullity8-10.test.js
      - name: Explicit extremal residual-rank construction and inversion
        run: node --test test/public-residual-extremal-construction.test.js
      - name: Independent rank-r coset-cycle verifier
        run: node sims/affine-low-rank-peer-check.js
      - name: Matched rank-r versus public-residual oracle calls
        run: node sims/affine-low-rank-method-comparison.js
      - name: Intrinsic affine-residual rank exact small-domain verifier
        run: node sims/affine-residual-minimal-rank-peer.js
      - name: Independent verifier strict JSDoc
        run: npx --no-install tsc -p jsconfig.affine-low-rank-peer.json
      - name: Project JSDoc type safety
        run: npm run typecheck

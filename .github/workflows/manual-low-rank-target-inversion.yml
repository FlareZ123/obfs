name: Manual low-rank target inversion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Low-rank target-inversion regressions
        run: node --test --test-reporter=spec test/low-rank-maximal-deficiency-inversion.test.js test/low-rank-target-guided-subspace-growth.test.js test/low-rank-exhaustive-width3.test.js
      - name: Project JSDoc type safety
        run: npm run typecheck

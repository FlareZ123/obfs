name: Manual low-rank target inversion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rank-r projected-affine fallback and diagnostic controls
        run: python sims/rank-r-top-derivative-fallback-controls.py
      - name: Monomial greedy offset-cover reproduction
        run: python sims/agent50-monomial-greedy-offset-cover-check.py
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Low-rank target-inversion regressions
        run: node --test --test-reporter=spec test/low-rank-maximal-deficiency-inversion.test.js test/low-rank-target-guided-subspace-growth.test.js test/low-rank-exhaustive-width3.test.js test/public-affine-residual-target-inverter32.test.js test/affine-low-rank-deterministic-completion.test.js
      - name: Independent exhaustive and seeded 4-bit peer verification
        run: node --test test/public-residual-independent-review.test.js
      - name: Independent seeded 5/6-bit multi-repair and inverse-space verification
        run: node --test test/public-residual-width5-6-independent.test.js
      - name: Independent full-target r-equals-nullity width-8/10 regression
        run: node --test test/public-residual-maximal-nullity8-10.test.js
      - name: Explicit extremal residual-rank construction and inversion
        run: node --test test/public-residual-extremal-construction.test.js
      - name: Independent finite-table full-rank residual-cycle theorem peer review
        run: node --test test/low-output-residual-cycle-independent.test.js
      - name: Independent rank-r coset-cycle verifier
        run: node sims/affine-low-rank-peer-check.js
      - name: Intrinsic low-rank quotient theorem with singular affine base
        run: node sims/low-rank-affine-singular-base-peer.js
      - name: Independent rank-two and rank-three affine-orbit review
        run: node sims/low-rank-orbit-independent-review.js
      - name: Layered rank-one inversion via canonical deterministic solver
        run: node sims/low-rank-affine-layer-composition.js
      - name: Matched rank-r versus public-residual oracle calls
        run: node sims/affine-low-rank-method-comparison.js
      - name: Intrinsic affine-residual rank exact small-domain verifier
        run: node sims/affine-residual-minimal-rank-peer.js
      - name: Nonbijective low-rank image-membership witness
        run: node sims/low-rank-affine-nonpermutation.js
      - name: Independent projected low-rank anti-concentration and image-envelope peer
        run: node sims/low-rank-nonbijective-independent-peer.js
      - name: Exhaustive independent nonbijective rank-two width-three peer
        run: node sims/low-rank-nonbijective-peer-width3.js
      - name: Affine-wrapped nonbijective 32-bit rank-two image membership
        run: node sims/low-rank-nonbijective-ranktwo-32.js
      - name: Independent exhaustive singular-affine quotient image envelopes
        run: node sims/low-rank-singular-envelope-peer-width3.js
      - name: Rank-two projected oracle polarization functional clone
        run: node sims/ranktwo-polarization-oracle-clone.js
      - name: Rank-three projected cubic-or-quadratic offline oracle clone
        run: node sims/rankthree-polarization-oracle-clone.js
      - name: Recover private rank-three code behavior from authenticated SCO HTTP RPC
        run: node sims/sco-rankthree-631-live-clone.js
      - name: Reconstruct private rank-six quadratic via authorized randomized SCO HTTP RPC
        run: node sims/sco-rank6-adaptive-real-http-clone.js
      - name: Matched native Node and SCO authenticated rank-six oracle learning
        run: node sims/sco-vs-native-rank6-matched-oracle.js
      - name: Matched rank-three projected versus generic cubic functional clone
        run: node sims/rankthree-projected-vs-generic-cubic-matched.js
      - name: Exhaustive vector-polar triple miss probability verifier
        run: node sims/rankthree-polar-triple-independent-check.js
      - name: Rank-four projected fourth derivative full oracle clone
        run: node sims/rankfour-projected-fourth-derivative-oracle-clone.js
      - name: Quartic-free projected rank-four cubic tensor rescue
        run: node sims/rankfour-projected-cubic-rescue.js
      - name: Silent rank-five permutation counterexample to projected cubic signature
        run: node sims/rankfour-projected-cubic-silent-rank-control.js
      - name: Reed-Muller-validated projected cubic clone
        run: node sims/rankfour-projected-cubic-validated-peer.js
      - name: Matched authenticated SCO and esbuild private-API rank-four cubic clone
        run: node sims/sco-rankfour-cubic-matched-private-api.js
      - name: Exhaustive vector cubic signature and radical independent peer
        run: node sims/rankfour-vector-signature-exhaustive.js
      - name: Exhaustive rank-five four-wedge output-rank witness frequencies
        run: node sims/rankfive-four-wedge-exhaustive.js
      - name: Matched rank-four projected versus generic quartic functional clone
        run: node sims/rankfour-projected-vs-generic-quartic-matched.js
      - name: Independent rank-three quadratic 244-query full clone
        run: node sims/rankthree-quadratic-polarization-peer.js
      - name: Independent exact-rank-four quadratic 503-query full clone
        run: node sims/rankfour-quadratic-polarization-peer.js
      - name: Adaptive exact-rank four five six quadratic offline oracle cloning
        run: node sims/rank4-6-quadratic-adaptive-polar-clone.js
      - name: Independent vector top-degree tensor quotient signature Gram reconstruction
        run: node sims/vector-top-tensor-quotient-peer.js
      - name: Exact rank-five quartic top-tensor full-function offline clone
        run: node sims/rankfive-top-quartic-functional-clone.js
      - name: Silent rank-six counterexample to quartic signature-span promise check
        run: node sims/rankfive-top-quartic-silent-rank-control.js
      - name: Reed-Muller-validated quartic clone with silent-rank fallback
        run: node sims/rankfive-top-quartic-validated-peer.js
      - name: Independent rank-six fifth-derivative top-quintic full-function clone
        run: node sims/rankfive-top-quintic-functional-clone-peer.js
      - name: Reed-Muller-validated quintic clone with silent-rank fallback
        run: node sims/rankfive-top-quintic-validated-peer.js
      - name: Arbitrary nonlinear rank-four-to-six source-independent offline coset clone
        run: node --test test/projected-affine-coset-profile-clone.test.js
      - name: Matched authenticated SCO and native HTTP clone of hidden arbitrary rank-five table
        run: node sims/sco-rankfive-arbitrary-table-real-http.js
      - name: Rank-three quadratic bilinear early clone and fallback
        run: node sims/rankthree-quadratic-bilinear-shortcut.js
      - name: Random-basis low-rank quadratic clone negative control
        run: node sims/rankthree-random-basis-attack.js
      - name: Exhaustive ideal-uniform GL4 quadratic clone and tail probability
        run: node sims/rankthree-uniform-gl4-peer.js
      - name: Authorized SCO rank-three quadratic live offline clone
        run: node sims/sco-rankthree-random-basis-live.js
      - name: Matched rank-two polar versus exact rank-certified learner
        run: node sims/ranktwo-quadratic-competitor.js
      - name: Exhaustive degree-two false-rank validation and exact fallback
        run: node sims/quadratic-rank-validated-offline.js
      - name: Independent exact rational tails for rank-four to six adaptive polar learning
        run: node sims/rankk-exact-tail-fraction-peer.js
      - name: Bounded-degree full clone to offline nonbijective inversion
        run: node sims/low-rank-nonbijective-offline-clone-bridge.js
      - name: Independent verifier strict JSDoc
        run: npx --no-install tsc -p jsconfig.affine-low-rank-peer.json
      - name: Quadratic radical exhaustive oracle attack
        run: node sims/quadratic-radical-peer-check.js
      - name: Matched 1100-query cap for quadratic versus residual methods
        run: node sims/quadratic-radical-public-residual-cap.js
      - name: Public-only quadratic functional cloning
        run: node sims/quadratic-functional-clone-peer-check.js
      - name: Cubic and quartic public-only exact functional clone
        run: node sims/bounded-degree-functional-clone-peer-check.js
      - name: Quadratic radical strict JSDoc
        run: npx --no-install tsc -p jsconfig.quadratic-radical.json
      - name: Project JSDoc type safety
        run: npm run typecheck

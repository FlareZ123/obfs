name: Targeted implicit console stack source-observation smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-observation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Run implicit source-coordinate differential
        run: node --test test/implicit-console-stack-source.test.js test/node-util-format-source-observation.test.js test/implicit-source-mode-matrix.test.js test/implicit-source-mode-fuzz.test.js test/node-process-warning-source-observation.test.js
      - name: Dynamic-input host source-boundary reproduction
        run: node sims/host-dynamic-exception-boundary.js
      - name: Unhandled rejection source-boundary reproduction
        run: node sims/unhandled-rejection-source-boundary.js
      - name: Native fixed-width source-coordinate feasibility
        run: node sims/source-coordinate-fixed-width-probe.js
      - name: Peer review exported instance source parity under COO and SNO
        if: ${{ !cancelled() }}
        run: node --test test/public-instance-prototype-source.test.js
      - name: Peer review external prototype method in real Chrome
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/public-instance-prototype-browser.js
      - name: Peer review live SCO HTTP method source in Chromium
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-exported-instance-http-source-browser.js
      - name: Peer review private direct-class positive property yield
        if: ${{ !cancelled() }}
        run: node --test test/private-class-source-yield.test.js
      - name: Adversarially verify private-class source escape proof
        if: ${{ !cancelled() }}
        run: node --test test/private-direct-class-escape-proof.test.js
      - name: Node CommonJS enclosing function source under private-class proof
        if: ${{ !cancelled() }}
        run: node --test test/cjs-wrapper-source-observer.test.js
      - name: Browser verifies positive private class rename yield
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/private-class-browser-positive.js
      - name: Structured positive and escaped-source class fuzz matrix
        if: ${{ !cancelled() }}
        run: node --test test/private-direct-class-structured-fuzz.test.js
      - name: Validate strict project JSDoc
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Validate external JSDoc
        if: ${{ !cancelled() }}
        run: npm run typecheck:external

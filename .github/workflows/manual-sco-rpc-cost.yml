name: Manual SCO RPC latency profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Measure loopback RPC overhead
        run: node sims/sco-rpc-cost.js
      - name: Profile artificial RTT and concurrent versus batched operations
        run: node sims/sco-rtt-grid.js
      - name: Strict-check SCO TLS simulation JSDoc
        run: npx tsc -p jsconfig.sco-tls.json
      - name: Measure authenticated TLS RPC overhead and replay controls
        run: node sims/sco-tls-boundary.js
      - name: Test authorized SCO black-box algorithm reconstruction
        run: node sims/sco-oracle-polynomial.js
      - name: Measure SCO response mutation coverage
        run: node sims/sco-response-diversity.js
      - name: Save reproducible raw timings
        uses: actions/upload-artifact@v4
        with:
          name: sco-rpc-cost
          path: |
            rpc-cost-output.json
            rpc-rtt-grid-output.json
            sco-oracle-polynomial-output.json
            sco-response-diversity-output.json

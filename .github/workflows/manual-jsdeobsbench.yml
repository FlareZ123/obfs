name: Manual external JsDeObsBench differential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-external-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: coo
            sourceType: script
          - mode: sno
            sourceType: script
          - mode: sno
            sourceType: commonjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Check independent static attack and external JSDoc
        if: matrix.mode == 'sno' && matrix.sourceType == 'script'
        run: |
          node --test test/jsdeobsbench-public-static-attack.test.js test/jsdeobsbench-public-esm.test.js
          npm run typecheck:external
      - name: Download upstream pinned verified corpus
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/Ch3nYe/JsDeObsBench/8b2e1c35dc4ae25a46ea580ea5dcb6b5de5edbe9/build_dataset/codenet_dataset_name-obfuscation/Project_CodeNet_selected.jsonl" \
            --output ./jsdeobsbench-native.jsonl
          actual="$(git hash-object ./jsdeobsbench-native.jsonl)"
          test "$actual" = "4bde98f958eb81b070f411f39545ea6d5339e8d8"
      - name: Audit external corpus without executing samples
        run: node sims/jsdeobsbench-audit.js ./jsdeobsbench-native.jsonl
      - name: Generate deterministic public source candidates
        run: node sims/jsdeobsbench-adapter.js --input ./jsdeobsbench-native.jsonl --output ./jsdeobsbench-obfuscated.jsonl --mode ${{ matrix.mode }} --source-type ${{ matrix.sourceType }} --seed pinned-jsdeobsbench-20261115 --max 1301
      - name: Measure public-source transformation coverage and emitted size
        run: node sims/jsdeobsbench-coverage.js ./jsdeobsbench-obfuscated.jsonl --require-transform
      - name: Publish source-only attacker view without native programs
        if: matrix.mode == 'sno'
        run: node sims/jsdeobsbench-public-protocol.js --publish ./jsdeobsbench-obfuscated.jsonl ./jsdeobsbench-public-only.jsonl
      - name: Stage strictly public attacker filesystem
        if: matrix.mode == 'sno'
        run: |
          node sims/jsdeobsbench-public-protocol.js --stage ./jsdeobsbench-public-only.jsonl ./isolated-attacker
          mkdir ./isolated-attacker-out
          chmod 0777 ./isolated-attacker-out
      - name: Recover strings in unprivileged networkless isolated attacker
        if: matrix.mode == 'sno'
        shell: bash
        run: |
          docker run --rm --network none --read-only --cpus 2 --memory 512m --pids-limit 64 \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m,mode=1777 \
            --user 65534:65534 \
            --mount "type=bind,src=${{ github.workspace }}/isolated-attacker,dst=/attacker,readonly" \
            --mount "type=bind,src=${{ github.workspace }}/isolated-attacker-out,dst=/output" \
            --workdir /attacker node:22-alpine \
            node sims/jsdeobsbench-public-static-attack.js \
              --input /attacker/public.jsonl \
              --output /output/recovered.jsonl \
              --require-progress
      - name: Verify recovered code against withheld compiler metrics
        if: matrix.mode == 'sno'
        run: node sims/jsdeobsbench-public-protocol.js --verify ./jsdeobsbench-obfuscated.jsonl ./isolated-attacker-out/recovered.jsonl ./jsdeobsbench-verified-recovered.jsonl
      - name: Compare recovered public code with native behavior in restricted Docker
        if: matrix.mode == 'sno'
        shell: bash
        run: |
          docker run --rm --network none --read-only --cpus 2 --memory 1g --pids-limit 64 \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m,mode=1777 \
            --user 65534:65534 \
            --mount "type=bind,src=${{ github.workspace }},dst=/work,readonly" \
            --workdir /work node:22-alpine \
            node sims/jsdeobsbench-differential.js \
              --original /work/jsdeobsbench-native.jsonl \
              --transformed /work/jsdeobsbench-verified-recovered.jsonl \
              --sample 0 --cases 2 --timeout 3000 \
              --seed pinned-jsdeobsbench-20261115
      - name: Independently execute paired baseline and transformed code in restricted Docker
        shell: bash
        run: |
          docker run --rm --network none --read-only --cpus 2 --memory 1g --pids-limit 64 \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m,mode=1777 \
            --user 65534:65534 \
            --mount "type=bind,src=${{ github.workspace }},dst=/work,readonly" \
            --workdir /work node:22-alpine \
            node sims/jsdeobsbench-differential.js \
              --original /work/jsdeobsbench-native.jsonl \
              --transformed /work/jsdeobsbench-obfuscated.jsonl \
              --sample 0 --cases 2 --timeout 3000 \
              --seed pinned-jsdeobsbench-20261115

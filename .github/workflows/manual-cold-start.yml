name: Manual cold-start budget evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node22:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Sample COO startup cost
        run: node sims/cold-start.js
      - name: Compare UTF-16 decoder strategies
        run: node sims/decoder-candidates.js

name: Manual cold-start budget evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node22:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Sample COO startup cost
        run: node sims/cold-start.js
      - name: Compare UTF-16 decoder strategies
        run: node sims/decoder-candidates.js
      - name: Measure typed-array decoder exposure to inherited array setters
        run: node sims/typed-array-decoder-tradeoff.js
      - name: Validate offline static string recovery
        run: node --test test/static-string-recovery.test.js
      - name: Validate offline property and module normalization
        run: node --test test/offline-reconstruction.test.js
      - name: Benchmark diversified SNO steady-state hot paths
        run: node sims/hotpath-mixed.js

  typed-array-windows:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare typed and ordinary decoder behavior and cold startup
        run: node sims/typed-array-decoder-tradeoff.js

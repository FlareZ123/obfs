name: Manual Agent 2 no-reset hW inference benchmark

on:
  workflow_dispatch:
    inputs:
      min_states:
        description: "Minimum target state count (2-12)"
        required: false
        default: 2
        type: number
      max_states:
        description: "Maximum target state count (2-12)"
        required: false
        default: 12
        type: number
      seeds:
        description: "Deterministic seeds per target state count (1-20)"
        required: false
        default: 2
        type: number
      timeout_seconds:
        description: "Per-fixture hW learner timeout"
        required: false
        default: 45
        type: number
      random_walk_length:
        description: "RandomWphWOracle random walk length"
        required: false
        default: 30
        type: number
      origin_states:
        description: "RandomWphWOracle test origin-state count"
        required: false
        default: 20
        type: number

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned hW implementation
        run: python -m pip install --disable-pip-version-check aalpy==2.0.0
      - name: Test evaluator semantics and step accounting
        run: python sims/test_agent2_hw_no_reset_evaluator.py
      - name: Run no-reset hW benchmark
        env:
          MIN_STATES: ${{ inputs.min_states || 2 }}
          MAX_STATES: ${{ inputs.max_states || 12 }}
          SEEDS: ${{ inputs.seeds || 2 }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || 45 }}
          RANDOM_WALK_LENGTH: ${{ inputs.random_walk_length || 30 }}
          ORIGIN_STATES: ${{ inputs.origin_states || 20 }}
        run: |
          python sims/agent2-hw-no-reset-benchmark.py \
            --min-states "$MIN_STATES" --max-states "$MAX_STATES" --seeds "$SEEDS" \
            --timeout-seconds "$TIMEOUT_SECONDS" \
            --random-walk-length "$RANDOM_WALK_LENGTH" \
            --origin-states "$ORIGIN_STATES" \
            > hw-no-reset-results.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path("hw-no-reset-results.json").read_text())
          seeds = int(os.environ["SEEDS"])
          min_states = int(os.environ["MIN_STATES"])
          max_states = int(os.environ["MAX_STATES"])
          expected_runs = (max_states - min_states + 1) * seeds
          assert 2 <= min_states <= max_states <= 12
          assert 1 <= seeds <= 20
          assert result["aalpy_version"] == "2.0.0"
          assert result["scope"]["state_counts"] == [min_states, max_states]
          assert result["total_runs"] == expected_runs
          assert result["completed_runs"] + result["timeouts"] + result["errors"] == expected_runs
          assert result["completed_runs"] > 0
          for row in result["results"]:
              assert row.get("query_calls", 0) == 0, row
              if row["status"] == "completed":
                  assert row["pre_calls"] == 1, row
                  assert row["post_calls"] == 1, row
                  assert row["sul_num_queries"] == 0, row
                  assert row["target_minimal"] and row["target_strongly_connected"], row
                  assert row["steps_total"] == row["sul_num_steps"] == row["trace_steps"], row
                  assert row["steps_oracle"] + row["steps_non_oracle"] == row["steps_total"], row
                  assert len(row["fixture_digest"]) == 64, row
                  assert len(row["trace_digest"]) == 64, row
          print("NO_RESET_HW_SUMMARY", json.dumps({
              "runs": result["total_runs"],
              "min_states": min_states,
              "max_states": max_states,
              "seeds_per_state_count": seeds,
              "timeout_seconds": int(os.environ["TIMEOUT_SECONDS"]),
              "random_walk_length": int(os.environ["RANDOM_WALK_LENGTH"]),
              "origin_states": int(os.environ["ORIGIN_STATES"]),
              "completed": result["completed_runs"],
              "timeouts": result["timeouts"],
              "errors": result["errors"],
              "exact_initial_clone_successes": result["exact_clone_successes"],
              "future_clone_successes": result["future_clone_successes"],
              "candidate_end_behavior_unambiguous_runs": sum(
                  bool(row.get("candidate_end_behavior_unambiguous")) for row in result["results"]
              ),
              "candidate_end_equivalence_classes_max": max(
                  (row.get("candidate_end_equivalence_classes", 0) for row in result["results"]),
                  default=0,
              ),
              "ambiguous_initial_behavior_runs": sum(
                  bool(row.get("ambiguous_initial_behavior")) for row in result["results"]
              ),
              "ambiguous_future_behavior_runs": result["ambiguous_future_behavior_runs"],
              "false_initial_convergences": sum(
                  bool(row.get("false_initial_convergence")) for row in result["results"]
              ),
              "false_future_convergences": result["false_future_convergences"],
              "initial_state_identified": result["initial_state_identified"],
              "elapsed_seconds": result["elapsed_seconds"],
          }, sort_keys=True))
          PY
      - name: Preserve evaluator-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-no-reset-hw-benchmark
          path: hw-no-reset-results.json

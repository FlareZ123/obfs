name: Manual SCO authorization regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sco-auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Real HTTP private capability session native versus SCO
        run: node sims/sco-private-capability-session-profile.js
      - name: Capability contract unit and generated facade
        run: node --test test/sco-capabilities.test.js test/sco-capabilities-http.test.js test/sco-capabilities-public-facade.test.js
      - name: Strict capability JSDoc
        run: npx tsc -p jsconfig.capability-review.json
      - name: Strict main project JSDoc
        run: npm run typecheck

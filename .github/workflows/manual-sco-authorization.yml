name: Manual SCO authorization regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sco-auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Matched SCO generated facade versus conventional authenticated server RPC
        run: node sims/sco-plain-server-control.js
      - name: Strict JSDoc type checking
        run: npm run typecheck
      - name: Strict external research JSDoc
        run: npm run typecheck:external

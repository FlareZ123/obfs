name: Manual SCO authorization regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sco-auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Targeted SCO HTTP and partition tests
        run: node --test test/sco-rpc-isolation.test.js test/sco-batch-state-model.test.js test/sco-batch-state-drift.test.js test/sco-batch-policy-closure.test.js test/sco-operation-auth.test.js test/sco-batch.test.js test/sco-partition.test.js test/sco-partition-private-init.test.js test/sco-partition-const-functions.test.js test/sco-keyed-isolation.test.js test/sco-selective-partition.test.js
      - name: Paired SCO stateful authorization runtime sample
        run: node sims/sco-batch-state-cost.js
      - name: Compare fine and coarse authenticated SCO immutable async expression calls
        run: node sims/sco-const-granularity.js
      - name: Strict JSDoc type checking
        run: npm run typecheck

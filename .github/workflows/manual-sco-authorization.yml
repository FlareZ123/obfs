name: Manual SCO authorization regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sco-auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Capability actual HTTP ESM native session
        run: node sims/sco-private-capability-session-profile.js
      - name: SCO capability standalone, HTTP and generated ESM
        run: node --test test/sco-capabilities.test.js test/sco-capabilities-http.test.js test/sco-capabilities-public-facade.test.js
      - name: Actual Chromium cross-principal private handle
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-capabilities-browser.js
      - name: Strict capability JSDoc
        run: npx tsc -p jsconfig.capability-review.json
      - name: Full project JSDoc
        run: npm run typecheck

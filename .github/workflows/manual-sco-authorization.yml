name: Manual SCO authorization regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sco-auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: SCO reused-request principal scope
        run: node --test test/sco-capabilities.test.js
      - name: Strict JSDoc type checking
        run: npm run typecheck
      - name: Strict JSDoc of external research scripts
        run: npm run typecheck:external

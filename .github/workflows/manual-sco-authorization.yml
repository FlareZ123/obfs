name: Manual SCO authorization regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sco-auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Targeted SCO HTTP and partition tests
        run: node --test test/sco-rpc-isolation.test.js test/sco-batch-state-model.test.js test/sco-batch-state-drift.test.js test/sco-batch-policy-closure.test.js test/sco-operation-auth.test.js test/sco-batch.test.js test/sco-partition.test.js test/sco-partition-private-init.test.js test/sco-partition-const-functions.test.js test/sco-keyed-isolation.test.js test/sco-selective-partition.test.js test/sco-intrinsic-realm.test.js test/sco-private-helpers.test.js test/sco-public-helpers.test.js test/sco-public-helper-grid.test.js test/sco-public-helper-oracle.test.js test/sco-private-const-relay.test.js
      - name: SCO known-safe versus unsafe realm admission coverage
        run: node sims/sco-realm-admission-coverage.js
      - name: Paired SCO stateful authorization runtime sample
        run: node sims/sco-batch-state-cost.js
      - name: Compare fine and coarse authenticated SCO immutable async expression calls
        run: node sims/sco-const-granularity.js
      - name: Selective SCO private-source and authorized-relay challenge
        run: node sims/sco-selective-challenge.js
      - name: Original versus online relay private-constant whole-session timing
        run: node sims/sco-private-const-relay.js
      - name: Real Chromium SCO private-constant ESM and cookie-authenticated RPC
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-private-const-browser.js
      - name: Real Chromium public/private SCO helper ESM and authenticated RPC
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-public-helper-browser.js
      - name: Strict JSDoc type checking
        run: npm run typecheck
      - name: Strict JSDoc of external research scripts
        run: npm run typecheck:external

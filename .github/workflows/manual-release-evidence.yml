name: Manual cross-mode security and runtime release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One source-pinned acceptance dispatch: reuse the established correctness,
  # matched-minifier, SCO equal-trust and SCO CPU workflows instead of asking
  # reviewers to assemble unrelated runs by hand.
  full-validation:
    name: Full two-OS Node, Chromium, JSDoc and runtime-budget validation
    uses: ./.github/workflows/manual-validation.yml

  matched-minifier:
    name: Matched COO/SNO minifier and independent attacker
    uses: ./.github/workflows/manual-minified-control.yml

  sco-equal-trust:
    name: Actual SCO facade versus equal-trust minified private API
    uses: ./.github/workflows/manual-sco-batch-equal-trust.yml

  sco-cpu:
    name: SCO client/server CPU boundary and fresh-client cost
    uses: ./.github/workflows/manual-sco-batch-cpu.yml

  application-challenge:
    name: Actual COO/SNO multi-file challenge and owner attack
    uses: ./.github/workflows/manual-application-challenge.yml

  application-sco:
    name: Actual SCO HTTP/Chromium application and source withholding

    uses: ./.github/workflows/manual-application-sco.yml

  adversarial-applications:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record exact resolved dependency tree for reproducibility
        run: npm ls --all
      - name: Strict JSDoc check of SNO and cross-mode release evidence
        run: npm run typecheck:external
      - name: Test fail-closed release decision semantics
        run: node --test test/release-evidence-gate.test.js
      - name: Compare real COO SNO and SCO adversarial applications
        env:
          OBFS_RELEASE_AUDIT_FILE: release-evidence-${{ runner.os }}.json
        run: node sims/release-evidence-gate.js
      - name: Retain full paired samples and security-axis evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ runner.os }}
          path: release-evidence-${{ runner.os }}.json
          if-no-files-found: error

  acceptance-decision:
    name: Fail-closed candidate acceptance decision
    if: always()
    needs:
      - full-validation
      - matched-minifier
      - sco-equal-trust
      - sco-cpu
      - application-challenge
      - application-sco
      - adversarial-applications
    runs-on: ubuntu-latest
    steps:
      - name: Require every exact-head acceptance dimension
        env:
          FULL_VALIDATION: ${{ needs.full-validation.result }}
          MATCHED_MINIFIER: ${{ needs.matched-minifier.result }}
          SCO_EQUAL_TRUST: ${{ needs.sco-equal-trust.result }}
          SCO_CPU: ${{ needs.sco-cpu.result }}
          APPLICATION_CHALLENGE: ${{ needs.application-challenge.result }}
          APPLICATION_SCO: ${{ needs.application-sco.result }}
          ADVERSARIAL_APPLICATIONS: ${{ needs.adversarial-applications.result }}
        run: |
          echo "full-validation=$FULL_VALIDATION"
          echo "matched-minifier=$MATCHED_MINIFIER"
          echo "sco-equal-trust=$SCO_EQUAL_TRUST"
          echo "sco-cpu=$SCO_CPU"
          echo "application-challenge=$APPLICATION_CHALLENGE"
          echo "application-sco=$APPLICATION_SCO"
          echo "adversarial-applications=$ADVERSARIAL_APPLICATIONS"
          test "$FULL_VALIDATION" = success
          test "$MATCHED_MINIFIER" = success
          test "$SCO_EQUAL_TRUST" = success
          test "$SCO_CPU" = success
          test "$APPLICATION_CHALLENGE" = success
          test "$APPLICATION_SCO" = success
          test "$ADVERSARIAL_APPLICATIONS" = success
          echo "ALL ACCEPTANCE DIMENSIONS GREEN FOR THIS EXACT SOURCE SHA"

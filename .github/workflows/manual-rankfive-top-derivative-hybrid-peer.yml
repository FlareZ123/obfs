name: Manual rank-five top-derivative projected-affine hybrid peer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce exact six/seven-direction witness query expectations
        run: python sims/agent50-rankfive-seven-direction-fixed-order-check.py
      - name: Reproduce exact-integer restart DP and independent collision check (Ubuntu only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD:sims/agent2-rankfive-witness-restart-dp-exact.cpp)" = "5fa6b3f2673f43a166a682d71a12e2175573178f"
          test "$(git rev-parse FETCH_HEAD:sims/agent2-rankfive-witness-independent-check.py)" = "e67866203285bc7f810dc9ebf6a279d605a10d41"
          git show FETCH_HEAD:sims/agent2-rankfive-witness-restart-dp-exact.cpp > /tmp/agent2-rankfive-witness-restart-dp-exact.cpp
          git show FETCH_HEAD:sims/agent2-rankfive-witness-independent-check.py > /tmp/agent2-rankfive-witness-independent-check.py
          g++ -O3 -std=c++20 /tmp/agent2-rankfive-witness-restart-dp-exact.cpp -o /tmp/rank7restartdpexact
          /tmp/rank7restartdpexact | tee rankfive-seven-direction-dp-exact.txt
          grep -q 'BEST k=10 Q=5526035598783/65394613305 = 84.502917281728' rankfive-seven-direction-dp-exact.txt
          python /tmp/agent2-rankfive-witness-independent-check.py | tee rankfive-seven-direction-independent-check.txt
          grep -q 'unconditional gap lower>1.506973688055' rankfive-seven-direction-independent-check.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Check hybrid peer syntax
        run: node --check sims/rankfive-top-derivative-projected-affine-hybrid-peer.js
      - name: Strict-check focused SCO oracle and hybrid JSDoc
        run: npx tsc -p jsconfig.sco-oracles.json
      - name: Run finite truth-table and adversarial fallback controls
        shell: bash
        run: set -o pipefail; node sims/rankfive-top-derivative-projected-affine-hybrid-peer.js | tee rankfive-top-derivative-hybrid-peer-output.txt
      - name: Run 1,000-source-paired query-count simulation
        shell: bash
        run: node sims/rankfive-top-derivative-hybrid-query-simulation.js | tee rankfive-top-derivative-hybrid-query-simulation.txt
      - name: Run 1,000-replicate randomized-source ensemble
        shell: bash
        run: node sims/rankfive-top-derivative-hybrid-source-ensemble.js | tee rankfive-top-derivative-hybrid-source-ensemble.txt
      - name: Preserve peer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rankfive-top-derivative-hybrid-peer-${{ matrix.os }}
          path: |
            rankfive-top-derivative-hybrid-peer-output.txt
            rankfive-seven-direction-dp-exact.txt
            rankfive-seven-direction-independent-check.txt
            rankfive-top-derivative-hybrid-query-simulation.txt
            rankfive-top-derivative-hybrid-query-simulation.json
            rankfive-top-derivative-hybrid-source-ensemble.txt
            rankfive-top-derivative-hybrid-source-ensemble.json

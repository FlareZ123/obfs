name: Manual SCO capability independent review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Exercise private capability state and actual SCO HTTP/ESM facade
        run: node --test test/sco-capabilities.test.js test/sco-capabilities-http.test.js test/sco-capabilities-public-facade.test.js
      - name: Profile actual authenticated HTTP sessions versus native capability work
        run: node sims/sco-private-capability-session-profile.js
      - name: Exercise real Chromium capability binding and cross-account denial
        if: runner.os == 'Linux'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-capabilities-browser.js
      - name: Typecheck private capability integration
        run: npx tsc -p jsconfig.capability-review.json
      - name: Strict main project JSDoc
        run: npm run typecheck

name: Manual SCO equal-trust cross-account loaded HTTP control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-contention:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Strict main and external JSDoc
        run: |
          npm run typecheck
          npm run typecheck:external
      - name: Confirm original private machine and conventional-vs-generated A load
        run: node sims/sco-ratchet-equal-trust-contention.js

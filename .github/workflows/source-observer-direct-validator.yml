name: Source-observer direct-validator reproduction

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit to test
        required: true
        default: "246af59679d4388703b93fb36918d9e9b344cca1"
        type: string
      harness_sha:
        description: Commit containing the pinned adversarial harness
        required: true
        default: "f82fbdf400f424471ad6f7e69d76d3d512ee5657"
        type: string

permissions:
  contents: read

concurrency:
  group: source-observer-direct-validator-${{ inputs.candidate_sha }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate source tree
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Load the pinned harness without modifying the candidate tree
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          HARNESS_SHA: ${{ inputs.harness_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin "$HARNESS_SHA"
          git show "$HARNESS_SHA:im-results/source-observer-rebind-counterexamples-2026-11-24.js" > "$RUNNER_TEMP/source-observer-rebind-counterexamples.js"
          sha256sum "$RUNNER_TEMP/source-observer-rebind-counterexamples.js"
          printf 'CANDIDATE_SHA=%s\nHARNESS_SHA=%s\n' "$CANDIDATE_SHA" "$HARNESS_SHA"

      - name: Execute the exact pinned direct-validator harness
        run: node "$RUNNER_TEMP/source-observer-rebind-counterexamples.js"

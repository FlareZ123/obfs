name: Manual source-proof conservative-refusal triage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Process diagnostic-report lexical shadowing differential
        run: node --test test/process-report-source-observer.test.js
      - name: Strict JSDoc
        run: npm run typecheck

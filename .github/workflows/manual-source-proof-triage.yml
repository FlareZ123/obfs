name: Manual source-proof conservative-refusal triage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Inspect inert-clone group versus local owner proofs
        run: node sims/inert-clone-source-triage.js
      - name: Bounded independent-source-observer island proof differential
        run: node --test test/source-observer-islands.test.js test/source-observer-coverage.test.js
      - name: Real Chromium source-island ESM linker, source parity and public normalizer
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/source-observer-islands-browser.js
      - name: Paired observer-island CPU and cold-start budget profile
        run: node sims/source-island-session-profile.js
      - name: Strict JSDoc proof implementation
        run: npm run typecheck
      - name: Strict external proof and adversarial JSDoc
        run: npm run typecheck:external

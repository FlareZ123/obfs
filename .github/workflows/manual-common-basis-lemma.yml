name: Manual common-basis lemma peer check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-basis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exhaust all 3-bit permutations and sample 4-bit common bases
        run: node sims/low-output-residual-common-basis-peercheck.js
      - name: Strict independent JSDoc
        run: npx --no-install tsc -p jsconfig.common-basis.json

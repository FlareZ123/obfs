name: Caught object-pattern TypeError source preservation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native and generated caught nullish object-pattern TypeErrors
        run: node sims/property-nullish-destructure-error-attack.js --expect-guarded
      - name: Run deterministic nullish object-pattern regression
        run: node --test test/property-nullish-destructure-error.test.js
      - name: Counterfactual nested identifier TypeError spelling probe
        run: node sims/identifier-nullish-nested-default-attack.js --expect-guarded
      - name: Computed-string destructuring TypeError spelling probe
        run: node sims/string-object-pattern-error-attack.js --expect-guarded
      - name: Host-lock stack-coordinate source guard
        run: node sims/host-lock-stack-source-attack.js --expect-guarded
      - name: Real Chromium caught nullish object-pattern error parity
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/property-nullish-destructure-chromium.js
      - name: Real Chromium host-lock stack-coordinate guard
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/host-lock-stack-chromium.js --expect-guarded
      - name: Real Chromium global error-coordinate source guard
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/browser-error-coordinate-attack.js --expect-guarded
      - name: Real Chromium Worker error-coordinate source guard
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/worker-error-coordinate-attack.js --expect-guarded
      - name: Validate compiler JSDoc types
        run: npm run typecheck

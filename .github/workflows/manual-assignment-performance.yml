name: Manual destructuring assignment performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Node.js assignment-flow hot and cold samples and static normalization control
        run: node sims/destructuring-assignment-performance.js
      - name: Main compiler JSDoc check
        run: npm run typecheck
      - name: Research tool strict JSDoc check
        run: npm run typecheck:external

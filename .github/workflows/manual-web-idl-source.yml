name: Manual Web IDL source-observation differential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node22:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Native and emitted Web IDL source-observer differential
        run: node --test test/fetch-constructor-function-source.test.js test/web-idl-record-source-observation.test.js test/web-idl-source-counterfactual.test.js test/web-idl-interfile-source.test.js test/web-idl-string-collection-methods.test.js
      - name: Real Chromium native/emitted Web IDL differential
        if: matrix.os == 'ubuntu-latest'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/web-idl-source-browser.js
      - name: Strict source-transform JSDoc typing
        run: npm run typecheck

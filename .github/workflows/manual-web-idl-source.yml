name: Manual Web IDL source-observation differential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node22:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Native and emitted Web IDL source-observer differential
        run: node --test test/fetch-constructor-function-source.test.js test/web-idl-record-source-observation.test.js test/web-idl-source-counterfactual.test.js test/web-idl-interfile-source.test.js test/web-idl-string-collection-methods.test.js test/web-idl-accessor-source-observation.test.js test/blob-options-function-source-observer.test.js test/blob-constructor-alias-source-observer.test.js test/blob-options-interfile-source.test.js test/sco-blob-interfile-source.test.js test/bound-native-constructor-source-observer.test.js test/inline-bound-native-coercer-source.test.js test/indirect-native-bind-source-observer.test.js test/blob-wasm-source-admission.test.js test/url-static-function-source.test.js test/url-static-interfile-source.test.js
      - name: Real Chromium native/emitted Web IDL differential
        if: matrix.os == 'ubuntu-latest'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/web-idl-source-browser.js
      - name: Real Chromium Blob options native/emitted differential
        if: matrix.os == 'ubuntu-latest'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/blob-options-browser.js
      - name: Real Chromium URL.parse source and selected-Wasm differential
        if: matrix.os == 'ubuntu-latest'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/url-static-source-browser.js
      - name: Real Chromium DOMString writable-property and HTML-stream source-observation matrix
        if: matrix.os == 'ubuntu-latest'
        env:
          CHROMIUM_BIN: google-chrome
        run: node sims/domstring-property-setter-source-matrix.js
      - name: Upload raw DOMString and HTML API observations
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: domstring-property-setter-matrix
          path: domstring-property-setter-matrix.json
          if-no-files-found: ignore
      - name: Strict source-transform JSDoc typing
        run: npm run typecheck
      - name: Strict JSDoc for DOM source-observation matrix
        run: node_modules/.bin/tsc -p jsconfig.domstring-matrix.json

name: Agent 5 Object.create descriptor adversarial audit

on:
  push:
    branches:
      - agent5/objectcreate-alias-audit-20261121

permissions:
  contents: read

jobs:
  alias:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/decoder-object-create-aliased-map.test.js test/decoder-object-create.test.js
      - run: npm run typecheck
      - name: Chromium ESM native/emitted decoder alias parity
        if: matrix.os == 'ubuntu-latest'
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/decoder-object-create-aliased-browser.js

name: Manual four-way minified ESM adversarial control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-way:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm frozen production source
        shell: bash
        run: |
          node -e 'if(process.env.GITHUB_SHA==="")throw Error("Missing commit ref")'
          git diff --exit-code a8a22f9aef6e7f0d487cebc23c87063376df55cb -- src/ bin/ examples/ package.json package-lock.json test/
      - name: Install project dependencies without changing package manifests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned external static deobfuscator
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund webcrack@2.16.0
      - name: Record external install version and immutable package entry hash
        run: node -e "const fs=require('node:fs');const c=require('node:crypto');const p=require.resolve('webcrack');console.log(JSON.stringify({entry:p,sha256:c.createHash('sha256').update(fs.readFileSync(p)).digest('hex')}))"
      - name: Independently transform minified and COO math, check heldout original outputs
        env:
          OBFS_WEBCRACK_REPORT: webcrack-${{ runner.os }}.json
          OBFS_WEBCRACK_ARTIFACT_DIR: webcrack-source-${{ runner.os }}
        run: node sims/webcrack-four-way-attacker.js
      - name: Upload pinned external tool evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webcrack-${{ runner.os }}
          path: |
            webcrack-${{ runner.os }}.json
            webcrack-source-${{ runner.os }}/*.mjs
          if-no-files-found: warn
      - name: Attribute published-byte changes to Webcrack deobfuscation versus unminification
        env:
          OBFS_WEBCRACK_ABLATION_REPORT: webcrack-ablation-${{ runner.os }}.json
        run: node sims/webcrack-stage-ablation.js
      - name: Archive exact stage-attribution digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webcrack-ablation-${{ runner.os }}
          path: webcrack-ablation-${{ runner.os }}.json
          if-no-files-found: warn
      - name: Verify public-byte minified function extraction
        run: node --test test/minified-control-static-attacker.test.js
      - name: Validate falsifiable candidate decision and strict sample veto
        run: node --test test/candidate-vs-minified-decision.test.js
      - name: Verify cross-runtime evidence merge and strict CPU veto
        run: node --test test/four-way-cross-runtime-verdict.test.js
      - name: Verify matched three-query oracle and nonlinear rejection control
        run: node --test test/polyvariant-app-three-query-competitor.test.js
      - name: Compare native minified obfuscated reconstructed full ESM application
        env:
          OBFS_FOUR_WAY_AUDIT_FILE: four-way-node-${{ runner.os }}.json
        run: node sims/polyvariant-app-four-way-control.js
      - name: Upload exact ESM whole-session timings
        uses: actions/upload-artifact@v4
        with:
          name: four-way-node-${{ runner.os }}
          path: four-way-node-${{ runner.os }}.json
          if-no-files-found: error
      - name: Real Chromium four-way ESM and host callback differential
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
          OBFS_FOUR_WAY_BROWSER_AUDIT_FILE: four-way-browser-${{ runner.os }}.json
        run: node test/polyvariant-app-four-way-browser.js
      - name: Real Chromium execution of exact pinned Webcrack source-only recovery
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
          OBFS_WEBCRACK_BROWSER_REPORT: webcrack-native-chromium-${{ runner.os }}.json
        run: node sims/webcrack-four-way-browser.js
      - name: Archive recovered-source Chromium outputs and negative control
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: webcrack-native-chromium-${{ runner.os }}
          path: webcrack-native-chromium-${{ runner.os }}.json
          if-no-files-found: error
      - name: Upload exact Chromium app timings
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: four-way-browser-${{ runner.os }}
          path: four-way-browser-${{ runner.os }}.json
          if-no-files-found: error
      - name: Cross-check emitted hashes and assess strict Node + Chromium CPU budget
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          OBFS_FOUR_WAY_NODE_FILE: four-way-node-${{ runner.os }}.json
          OBFS_FOUR_WAY_BROWSER_FILE: four-way-browser-${{ runner.os }}.json
          OBFS_FOUR_WAY_JOIN_FILE: four-way-cross-runtime-${{ runner.os }}.json
        run: node sims/four-way-cross-runtime-verdict.js
      - name: Upload cross-runtime strict-budget and attacker verdict
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: four-way-cross-runtime-${{ runner.os }}
          path: four-way-cross-runtime-${{ runner.os }}.json
          if-no-files-found: error
      - name: Strict JSDoc across the branch
        if: always()
        run: npm run typecheck:external

name: Manual four-way minified ESM adversarial control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-way:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact declared minifier and project libraries
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify public-byte minified function extraction
        run: node --test test/minified-control-static-attacker.test.js
      - name: Compare native minified obfuscated reconstructed full ESM application
        run: node sims/polyvariant-app-four-way-control.js

name: Manual four-way minified ESM adversarial control

on:
  workflow_dispatch:
    inputs:
      skip_external_attacker:
        description: 'Explicit core-only run when pinned JSIMPLIFIER npm tarball is unavailable; report external axis as unmeasured'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  four-way:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact declared minifier and project libraries
        run: npm install --no-package-lock --ignore-scripts
      - name: Checkout pinned JSIMPLIFIER external attacker
        if: ${{ !inputs.skip_external_attacker }}
        uses: actions/checkout@v4
        with:
          repository: XingTuLab/JSIMPLIFIER
          ref: eaa72ae63758957ac95b2f5e3391fefb96827987
          path: external/JSIMPLIFIER
          persist-credentials: false
      - name: Record JSIMPLIFIER provenance and normalize temporary registry URLs
        if: ${{ !inputs.skip_external_attacker }}
        working-directory: external/JSIMPLIFIER
        run: node -e 'const fs=require("node:fs");const crypto=require("node:crypto");const lock=fs.readFileSync("package-lock.json","utf8");fs.appendFileSync(process.env.GITHUB_ENV,"JSIMPLIFIER_LOCK_SHA256="+crypto.createHash("sha256").update(lock).digest("hex")+"\n");fs.writeFileSync("package-lock.json",lock.replaceAll("https://registry.npmmirror.com/","https://registry.npmjs.org/"));const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));const lic=fs.readFileSync("LICENSE","utf8");console.log(JSON.stringify({packageLicense:pkg.license,licenseHeader:lic.split(/\r?\n/).slice(0,2).join(" ")}));'
      - name: Install pinned JSIMPLIFIER dependencies without lifecycle scripts
        if: ${{ !inputs.skip_external_attacker }}
        working-directory: external/JSIMPLIFIER
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run LLM-disabled JSIMPLIFIER against minified and published math
        if: ${{ !inputs.skip_external_attacker }}
        env:
          OBFS_JSIMPLIFIER_ROOT: \${{ github.workspace }}/external/JSIMPLIFIER
          OBFS_JSIMPLIFIER_REPORT: jsimplifier-\${{ runner.os }}.json
        run: node sims/jsimplifier-static-attacker.js
      - name: Upload external deobfuscator attack report
        if: ${{ !inputs.skip_external_attacker }}
        uses: actions/upload-artifact@v4
        with:
          name: jsimplifier-\${{ runner.os }}
          path: jsimplifier-\${{ runner.os }}.json
          if-no-files-found: error
      - name: Verify public-byte minified function extraction
        run: node --test test/minified-control-static-attacker.test.js
      - name: Validate falsifiable candidate decision and strict sample veto
        run: node --test test/candidate-vs-minified-decision.test.js
      - name: Verify cross-runtime evidence merge, source commitment and strict CPU veto
        run: node --test test/four-way-cross-runtime-verdict.test.js
      - name: Verify matched three-query oracle and nonlinear rejection control
        run: node --test test/polyvariant-app-three-query-competitor.test.js
      - name: Compare native minified obfuscated reconstructed full ESM application
        env:
          OBFS_FOUR_WAY_AUDIT_FILE: four-way-node-${{ runner.os }}.json
        run: node sims/polyvariant-app-four-way-control.js
      - name: Upload exact ESM whole-session timings
        uses: actions/upload-artifact@v4
        with:
          name: four-way-node-${{ runner.os }}
          path: four-way-node-${{ runner.os }}.json
          if-no-files-found: error
      - name: Real Chromium four-way ESM and host callback differential
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
          OBFS_FOUR_WAY_BROWSER_AUDIT_FILE: four-way-browser-${{ runner.os }}.json
        run: node test/polyvariant-app-four-way-browser.js
      - name: Upload exact Chromium app timings
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: four-way-browser-${{ runner.os }}
          path: four-way-browser-${{ runner.os }}.json
          if-no-files-found: error
      - name: Cross-check emitted hashes and assess strict Node + Chromium CPU budget
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          OBFS_FOUR_WAY_NODE_FILE: four-way-node-${{ runner.os }}.json
          OBFS_FOUR_WAY_BROWSER_FILE: four-way-browser-${{ runner.os }}.json
          OBFS_FOUR_WAY_JOIN_FILE: four-way-cross-runtime-${{ runner.os }}.json
        run: node sims/four-way-cross-runtime-verdict.js
      - name: Upload cross-runtime strict-budget and attacker verdict
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: four-way-cross-runtime-${{ runner.os }}
          path: four-way-cross-runtime-${{ runner.os }}.json
          if-no-files-found: error
      - name: Strict JSDoc across the branch after independent experiment results
        if: always()
        run: npm run typecheck:external

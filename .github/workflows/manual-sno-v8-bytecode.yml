name: Manual SNO V8 bytecode candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install repository dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Install pinned bytecode candidate and attacker
        run: npm install --no-save --no-package-lock bytenode@2.1.0 @ejfkdev/jscd@0.3.3
      - name: Run source-free V8 bytecode candidate against jscd
        run: node sims/sno-v8-bytecode-jscd.js

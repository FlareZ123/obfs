name: Manual original-source asset extraction attack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-asset-attack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Checkout vulnerable historical baseline
        uses: actions/checkout@v4
        with:
          ref: 5c24cc02066fc27d29fc95d80ea89b005ca9071e
          path: baseline
      - name: Checkout immediate XML MIME prepatch baseline
        uses: actions/checkout@v4
        with:
          ref: 2cbf1620a8d50919e60deef51cfcafa1e6bb3471
          path: xml-previous
      - name: Checkout inline-style prepatch baseline
        uses: actions/checkout@v4
        with:
          ref: 0a072818f9d46112e25626e5de7ffc357678ee08
          path: style-previous
      - name: Checkout data-stylesheet prepatch baseline
        uses: actions/checkout@v4
        with:
          ref: 2f980e8103d4b69181e89924d9c4c790f75699ff
          path: data-style-previous
      - name: Checkout current protected candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: protected
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install baseline dependencies
        working-directory: baseline
        run: npm install --no-package-lock --ignore-scripts
      - name: Install XML MIME prepatch dependencies
        working-directory: xml-previous
        run: npm install --no-package-lock --ignore-scripts
      - name: Install inline-style prepatch dependencies
        working-directory: style-previous
        run: npm install --no-package-lock --ignore-scripts
      - name: Install data-stylesheet prepatch dependencies
        working-directory: data-style-previous
        run: npm install --no-package-lock --ignore-scripts
      - name: Install protected dependencies
        working-directory: protected
        run: npm install --no-package-lock --ignore-scripts
      - name: Run source-map, inline HTML and opaque-source disclosure attack
        run: node protected/sims/asset-disclosure-attack.js baseline protected
      - name: Verify XML MIME asset disclosure against immediate prepatch
        run: node protected/sims/xml-data-url-attack.js xml-previous protected
      - name: Paired CSS source-map extraction from HTML and SVG
        run: node protected/sims/inline-style-map-attack.js style-previous protected
      - name: Paired nested data-URL stylesheet source-map extraction
        run: node protected/sims/html-data-stylesheet-attack.js data-style-previous protected
      - name: Verify HTML, SVG and CSS source-map regressions
        working-directory: protected
        run: node --test test/html-asset-disclosure.test.js test/html-data-stylesheet-disclosure.test.js test/svg-asset-disclosure.test.js test/css-source-map-annotation.test.js
      - name: Strict JSDoc preflight checks
        working-directory: protected
        run: npm run typecheck

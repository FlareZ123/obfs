name: Manual independent webcrack adversary against frozen PR384

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webcrack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify unchanged original obfuscator and dependency pins
        run: git diff --exit-code a8a22f9aef6e7f0d487cebc23c87063376df55cb HEAD -- src package.json package-lock.json
      - name: Install frozen declared project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install version-pinned independent attacker in isolated package directory
        run: npm install --prefix external/webcrack --no-audit --no-fund
      - name: Record exact resolved third-party dependency graph
        run: node -e 'const fs=require("node:fs");const crypto=require("node:crypto");const lock=fs.readFileSync("external/webcrack/package-lock.json");console.log("WEBCRACK_DEPENDENCY_LOCK_SHA256 "+crypto.createHash("sha256").update(lock).digest("hex"));'
      - name: Attack minified and published math with heldout execution comparison
        env:
          OBFS_WEBCRACK_ROOT: ${{ github.workspace }}/external/webcrack
          OBFS_WEBCRACK_REPORT: webcrack-${{ runner.os }}.json
        run: node sims/agent3-webcrack-external-attacker.js
      - name: Upload resolved dependency lock and external attack report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webcrack-${{ runner.os }}
          path: |
            external/webcrack/package-lock.json
            webcrack-${{ runner.os }}.json
          if-no-files-found: warn
      - name: Strict JSDoc for external research tools
        if: always()
        run: npm run typecheck:external

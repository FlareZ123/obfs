name: Manual Agent 6 multi-slot private record proof

# Opt-in isolated differential: do not turn research-only branches into
# automatic build load. Source-pinned red-first and patched replay.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Two-platform native/obfuscated multi-slot owner plus historical record controls
        run: node --test test/agent6-multi-slot-private-record-proof.test.js test/private-record-proof.test.js
      - name: Strict project JSDoc
        run: npm run typecheck
      - name: Strict external JSDoc
        run: npm run typecheck:external

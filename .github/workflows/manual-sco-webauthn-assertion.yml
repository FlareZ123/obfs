name: Manual SCO WebAuthn assertion acceptance

# Opt-in, source-pinned coverage for the experimental trusted SCO admission
# module. Dispatch only on a branch that contains src/sco-webauthn-admission.js.
# Green indicates API correctness on selected controls, NOT obfuscation strength
# or an overall 2.5x security/performance release decision.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node22:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify WebAuthn assertion, signed-frame, and real private SCO HTTP semantics
        run: node --test test/sco-webauthn-admission.test.js
      - name: Verify single-host SQLite WAL cross-process nonce and revocation state
        run: node --test test/sco-webauthn-durable-state.test.js
      - name: Strict project JSDoc
        run: npm run typecheck
      - name: Strict external JSDoc
        run: npm run typecheck:external

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check real Chromium binary
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Real virtual authenticator RP/origin binding and authorized bearer relay negative
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/sco-webauthn-admission-browser.js

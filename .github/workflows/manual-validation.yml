name: Manual obfuscator validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node22:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Local parameter cases and real three-file host
        run: node --test --test-reporter=spec test/local-parameter-owned-value.test.js test/local-parameter-shorthand-field.test.js test/local-parameter-value-multifile-attack.test.js test/local-parameter-value-fuzz.test.js test/local-parameter-value-public-attack.test.js
      - name: Production JSDoc
        run: npm run typecheck
      - name: External JSDoc
        run: npm run typecheck:external
      - name: Real examples yield count
        run: node sims/local-parameter-example-yield.js
      - name: Fresh startup and warm profile
        run: node sims/local-parameter-value-profile.js
      - name: Actual Chromium
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: npm run test:browser

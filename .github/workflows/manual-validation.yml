name: Manual obfuscator validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node22:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        id: install
        run: npm install --no-package-lock --ignore-scripts
      - name: Behavioral and adversarial suites with compact failure diagnostics
        run: node --test --test-reporter=spec test/*.test.js
      - name: JSDoc type safety
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Strict JSDoc for external corpus research tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck:external
      - name: Performance sample
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run benchmark
      - name: Real Chromium module and host-lock integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: npm run test:browser

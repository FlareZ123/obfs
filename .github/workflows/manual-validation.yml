name: Manual obfuscator validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shorthand-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Local formal literal and shorthand native/generated correctness
        run: node --test test/local-parameter-owned-value.test.js test/local-parameter-shorthand-field.test.js
      - name: Paired deterministic typed-value fuzz and independent source-only tamper
        run: node --test test/local-parameter-value-fuzz.test.js test/local-parameter-value-public-attack.test.js
      - name: Strict JSDoc production and external research tooling
        run: npm run typecheck
      - run: npm run typecheck:external
      - name: Natural before-source grammar yield and its controls
        run: node --test test/local-parameter-example-yield.test.js
      - name: Native/emitted fresh-process whole-session runtime, clone
        run: node sims/local-parameter-value-profile.js
      - name: Real Chromium ESM private-field and receiver negative
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: npm run test:browser

name: Manual obfuscator validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Prototype setter versus shorthand own-field regression
        run: node --test test/identifier-shorthand-proto-semantics.test.js
      - name: Lexical formal direct and shorthand, all refusing conditions
        run: node --test test/local-parameter-owned-value.test.js test/local-parameter-shorthand-field.test.js
      - name: Seeded 512-case native parity and public tamper
        run: node --test test/local-parameter-value-fuzz.test.js test/local-parameter-value-public-attack.test.js
      - name: Three-file real Node ESM published-source normalization and host tamper
        run: node --test test/local-parameter-value-multifile-attack.test.js
      - name: Strict production and research JSDoc
        run: npm run typecheck
      - run: npm run typecheck:external
      - name: Original source AST grammar yield with synthetic positive controls
        run: node --test test/local-parameter-example-yield.test.js
      - name: Explicit and shorthand paired process profiles and unmodified clone
        run: node sims/local-parameter-value-profile.js
      - name: Real Chromium ESM shorthand two-file owner and reflected owner refusal
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: npm run test:browser

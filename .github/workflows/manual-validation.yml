name: Manual obfuscator validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example-yield:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Probe real unchanged source corpus and seeded positive/negative AST controls
        run: node --test test/local-parameter-example-yield.test.js
      - name: Report exact code grammar candidate counts
        run: node sims/local-parameter-example-yield.js

name: Manual obfuscator validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent50-rank-one-review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exhaust every width-three rank-one form
        run: node sims/compatible-rank-one-shear-exhaustive-width3.js
      - name: Re-run width-32 randomized theorem reproducer
        run: node sims/compatible-rank-one-shear-two-sided-inversion.js
      - name: Strict JSDoc for research tools
        run: npm run typecheck:external

name: Manual obfuscator validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low-rank-quotient:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify low-rank shear quotient pilot
        run: node sims/low-rank-shear-quotient-pilot.js
      - name: Strict JSDoc for research tools
        run: npm run typecheck:external

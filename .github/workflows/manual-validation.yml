name: Manual obfuscator validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node22:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Nonvacuous local formal-value semantic differential and refusal
        run: node --test test/local-parameter-owned-value.test.js
      - name: Paired startup/hot owner profile and public-source copy
        run: node sims/local-parameter-value-profile.js
      - name: Strict JSDoc
        run: npm run typecheck
      - name: Real Chromium ESM positive and refusal tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: npm run test:browser

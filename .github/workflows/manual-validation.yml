name: Manual obfuscator validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-attack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Three-file source-only relabel and hostile host callback tamper
        run: node --test test/local-parameter-value-multifile-attack.test.js
      - name: Explicit and shorthand paired fresh process profiles
        run: node sims/local-parameter-value-profile.js
      - name: Strict JSDoc for new attacker and scanner
        run: npm run typecheck:external
      - name: Frozen source grammar scan
        run: node sims/local-parameter-example-yield.js

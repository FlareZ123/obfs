name: Manual obfuscator validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Strict production and external research tooling types
        run: npm run typecheck
      - run: npm run typecheck:external
      - name: Natural source example AST parser and bounds
        run: node --test test/local-parameter-example-yield.test.js
      - name: Public-only tamper runner
        run: node --test test/local-parameter-value-public-attack.test.js
      - name: 512 seeded VM positive and 20 refusals
        run: node --test test/local-parameter-value-fuzz.test.js

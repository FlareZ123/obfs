name: Manual obfuscator validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node22:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        id: install
        run: npm install --no-package-lock --ignore-scripts
      - name: Behavioral and adversarial suites with compact failure diagnostics
        run: node --test --test-reporter=spec test/*.test.js
      - name: Vary original private arithmetic source and obfuscator seed with post-answer audit
        env:
          OBFS_BLIND_AUDIT_FILE: blind-affine-audit-${{ runner.os }}.json
        run: node sims/blind-affine-public-recovery-matrix.js
      - name: Persist complete blind post-answer transcripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: blind-affine-audit-${{ runner.os }}
          path: blind-affine-audit-${{ runner.os }}.json
          if-no-files-found: error
      - name: JSDoc type safety
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Strict JSDoc for external corpus research tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck:external
      - name: Performance sample
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run benchmark
      - name: Paired own-key and null-prototype six-module startup-and-session profiles
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node sims/verified-record-session-profile.js
      - name: Real Chromium module and host-lock integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: npm run test:browser
      - name: Real Chromium null-prototype protected-key and host-inheritance parity
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/verified-record-browser.js
      - name: Real Chromium cross-module owner-field observation differential
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: node test/esm-observation-browser.js

name: Manual obfuscator validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node22:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Admission diagnosis across graph variants
        run: node sims/local-param-admission-probe.js
      - name: Production JSDoc
        run: npm run typecheck
      - name: External JSDoc
        run: npm run typecheck:external
      - name: Real example eligibility
        run: node sims/local-parameter-example-yield.js
      - name: Paired startup and warm profile
        run: node sims/local-parameter-value-profile.js
      - name: Chromium module integration
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          CHROMIUM_BIN: google-chrome
        run: npm run test:browser
